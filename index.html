/* Layout: a design-journal workspace — navy masthead, criterion ring, strand tabs on graph paper */
:root{
  --navy:#1B2D4E; --red:#DC2B3E; --bg:#F3F5F9; --paper:#FFFFFF; --ink:#16223A; --muted:#5B6782;
  --line:#D8DEEA; --grid:rgba(27,45,78,.045); --soft:#E9EDF5; --ok:#1E8A55; --okbg:#E3F4EA; --warn:#B26A00; --warnbg:#FFF2DC; --bad:#C0283A; --badbg:#FBE5E8;

  --f-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-display: "Arial Black", Arial, "Helvetica Neue", sans-serif;
  --f-mono: "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --paper:#16213A; --ink:#E7ECF6; --muted:#9AA7C2; --line:#2A3858; --grid:rgba(255,255,255,.035); --soft:#1D2A47;
  --ok:#47C487; --okbg:#143326; --warn:#F0B44C; --warnbg:#3A2C10; --bad:#FF6B7C; --badbg:#3E1820; --accent:#FF5468; --mast:#0A1220; --mastfg:#FFFFFF; --navy:#8FB0E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --paper:#16213A; --ink:#E7ECF6; --muted:#9AA7C2; --line:#2A3858; --grid:rgba(255,255,255,.035); --soft:#1D2A47;
  --ok:#47C487; --okbg:#143326; --warn:#F0B44C; --warnbg:#3A2C10; --bad:#FF6B7C; --badbg:#3E1820; --accent:#FF5468; --mast:#0A1220; --mastfg:#FFFFFF; --navy:#8FB0E8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mast)}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* masthead */
.mast{background:var(--mast);color:var(--mastfg);position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-bottom:4px solid var(--red)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);letter-spacing:.02em;font-size:17px}
.brand .mk{width:34px;height:34px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-size:13px}
.brand small{display:block;font-family:var(--f-body);font-weight:normal;font-size:11px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.mast .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.12);color:var(--mastfg);border:0}
.chip.pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
main{padding-block:22px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:bold}
.btn{border:0;border-radius:8px;padding:10px 16px;background:var(--red);color:#fff;font-weight:bold;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:bold}
input[type=text],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;width:100%;font-weight:normal}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.notice{border-radius:8px;padding:10px 14px;font-size:14px}
.notice.ok{background:var(--okbg);color:var(--ok)}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.bad{background:var(--badbg);color:var(--bad)}
/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.login{grid-template-columns:1fr}}
.hero h1{font-family:var(--f-display);font-size:clamp(28px,4.6vw,44px);color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--accent)}
.cycle-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.cycle-legend div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.cycle-legend b{font-family:var(--f-display);color:var(--accent);margin-right:6px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:9px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;font-weight:bold;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* dashboard */
.unitbar{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.unitbar>div{min-width:0;flex:1}
.unitbar h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,32px)}
.brief{border-left:4px solid var(--accent);background:var(--paper);padding:14px 16px;border-radius:0 8px 8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.crit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.crit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.crit-grid{grid-template-columns:1fr}}
.crit{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:190px}
.crit .L{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--accent)}
.crit.locked .L{color:var(--muted)}
.crit h3{font-size:16px}
.crit .state{margin-top:auto;font-size:12px;font-weight:bold;display:flex;align-items:center;gap:6px}
.crit.open{cursor:pointer;transition:transform .15s,box-shadow .15s}
.crit.open:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(27,45,78,.12)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
/* criterion stepper */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 auto;min-width:118px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:2px}
.step b{font-size:13px}
.step .n{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.step[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.step.done .n::after{content:" ✓";color:var(--ok);font-weight:bold}
.step:disabled{opacity:.45;cursor:not-allowed}
.pane{margin-top:16px}
/* video */
.player{background:var(--mast);color:#fff;border-radius:var(--r);overflow:hidden;position:relative}
.stage{aspect-ratio:16/9;max-width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:center;padding:clamp(16px,4vw,40px);position:relative}
@media (max-width:600px){.stage{grid-template-columns:1fr;aspect-ratio:auto;min-height:360px}.stage svg{max-height:120px}}
.stage svg{width:100%;height:auto;max-height:260px}
.stage .txt{min-width:0}
.stage .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#FF8C99;font-weight:bold}
.stage h2{font-family:var(--f-display);font-size:clamp(18px,2.8vw,30px);margin:6px 0 10px;color:#fff}
.stage p{margin:0;font-size:clamp(13px,1.6vw,16px);color:#D9E2F2}
.scene-in{animation:sceneIn .6s ease both}
@keyframes sceneIn{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.controls{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.controls button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:7px 12px;font-weight:bold}
.controls .prog{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.controls .prog i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
.controls .tc{font-family:var(--f-mono);font-size:12px;color:#C9D3E6}
.ring-arc{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.scene-in,.ring-arc,.pulse{animation:none!important;stroke-dashoffset:0!important}}
/* content tables */
.model table,.tbl{border-collapse:collapse;width:100%;font-size:14px}
.model th,.model td,.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.model th,.tbl th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto;max-width:100%}
.model p{margin:.3em 0 .6em}
.model .note{font-size:13px;color:var(--muted);font-style:italic}
.strand-h{display:flex;gap:12px;align-items:baseline}
.roman{font-family:var(--f-display);color:var(--accent);font-size:20px;min-width:34px}
.why{background:var(--okbg);color:var(--ok);font-size:13px;padding:8px 12px;border-radius:7px}
.rub th:first-child,.rub td:first-child{width:70px;text-align:center;font-family:var(--f-mono)}
.rub tr.top td{background:var(--okbg)}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starters span{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:4px 9px;font-size:13px}
/* exercise */
.q{font-size:18px;font-weight:bold}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:11px 14px}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);margin-bottom:6px}
.ord li span{flex:1;min-width:0}
.ord ol{padding:0;margin:0;list-style:none}
.cls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.cls-row span{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.field>.seg{align-self:flex-start}
#roleSeg button{padding:8px 20px;font-size:14px;font-weight:bold}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--paper)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:8px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}

.strand-tabs{display:flex;gap:6px;flex-wrap:wrap}
.strand-tabs button{border:1px solid var(--line);background:var(--paper);border-radius:8px 8px 0 0;padding:8px 14px;font-weight:bold;border-bottom:3px solid transparent}
.strand-tabs button[aria-selected=true]{border-bottom-color:var(--accent)}
.strand-tabs button.done::after{content:" ✓";color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px}
.field .lbl{font-weight:bold}
.counter{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.ok{color:var(--ok)}
.tin input{border:0;width:100%;padding:6px 4px;background:transparent;min-width:110px}
.tin td{padding:0 4px}
.sk{border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:8px}
.sk canvas{width:100%;max-width:100%;aspect-ratio:4/3;background:#fff;border-radius:6px;border:1px solid var(--line);touch-action:none}
.sk img{border-radius:6px;border:1px solid var(--line);max-height:420px;object-fit:contain;background:#fff}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:1px}
.bands{display:flex;gap:6px;flex-wrap:wrap}
.bands button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 12px;font-family:var(--f-mono)}
.bands button[aria-pressed=true]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:min(980px,100%);max-height:88vh;overflow:auto}
.toggle-grid td,.toggle-grid th{text-align:center}
.sw-t{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--line)}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw-t[aria-checked=true]{background:var(--ok)}
.sw-t[aria-checked=true]::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mast);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.preview-banner{background:var(--warnbg);color:var(--warn);font-size:13px;text-align:center;padding:6px}
[data-read]{position:relative}
[data-read]:not(.brief)>*:nth-child(2){padding-right:104px}
.brief[data-read]{padding-right:112px}
.listen{position:absolute;top:12px;right:12px;z-index:1;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:bold}
.listen[aria-pressed=true]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.chip.lang select{background:transparent;border:0;color:var(--mastfg);padding:0;width:auto;font-size:12px}
.chip.lang select option{color:#16223A}
#gtHost,.goog-te-banner-frame,.skiptranslate>iframe,#goog-gt-tt,.goog-te-balloon-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:640px){.checks{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:14px;cursor:pointer}
.chk input{margin-top:3px}
.view-only>:not(.listen){pointer-events:none;user-select:none}
.view-only{opacity:.92}
footer{font-size:12px;color:var(--muted);text-align:center;padding-block:20px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-all}
ol.guide li{margin-bottom:8px}

  /* ---------------- WORKED EXAMPLES (different scenario per grade) ---------------- */
  examples: {
    "6": {
      A: [
        `<p><b>The problem:</b> at the Seaview bus stop, passengers wait in strong sun for up to 20 minutes and do not know when the next bus will arrive. Older people and young children are affected most.</p><p><b>Why it needs solving:</b> standing in the heat can make people feel unwell, and when waiting is uncomfortable people choose cars instead of buses, which adds traffic and pollution to the city.</p>`,
        `<table><tr><th>Research question</th><th>Why it matters</th><th>Priority</th></tr><tr><td>How hot does the stop get at midday?</td><td>Shows how serious the problem is</td><td>1</td></tr><tr><td>What do passengers want to know while waiting?</td><td>Tells me what information to show</td><td>2</td></tr><tr><td>How do other cities show bus times?</td><td>Gives me ideas</td><td>3</td></tr><tr><td>Which colours are easy to read in bright sun?</td><td>Helps people read the screen</td><td>4</td></tr></table><p class="note">Heat is first because it affects people's health.</p>`,
        `<table><tr><th>Product</th><th>What it does</th><th>What I like</th><th>What I would change</th></tr><tr><td>Air-conditioned bus shelters in Dubai</td><td>Gives passengers a cool place to wait</td><td>Protects people from heat</td><td>Use solar power to save energy</td></tr><tr><td>Countdown signs at bus stops</td><td>Shows minutes until the next bus</td><td>Simple and quick to read</td><td>Brighter screen for strong sunlight</td></tr><tr><td>A bus-tracking app</td><td>Shows buses moving on a map</td><td>Always in your pocket</td><td>Not everyone has a phone</td></tr></table>`,
        `<p><b>Main findings:</b> (1) shade and cool air matter most to passengers; (2) people want to know exactly when the bus will come; (3) screens need high contrast to be read in sunlight.</p><p><b>What this means:</b> my smart bus-stop screen should show live arrival times in large, high-contrast numbers and point people to the shaded seats.</p>`
      ],
      B: [
        `<table><tr><th>My design is successful if…</th><th>How I will test it</th></tr><tr><td>The arrival time can be read from 2 metres away</td><td>Three classmates read it from 2 m</td></tr><tr><td>It uses no more than 3 colours</td><td>I count the colours</td></tr><tr><td>It shows where the shade is</td><td>A tester finds the shade in 5 seconds</td></tr><tr><td>Every piece of information has an icon</td><td>I check each section</td></tr><tr><td>Older people can read the text</td><td>I ask an adult to read it</td></tr></table>`,
        `<p><b>Idea 1 (sketch):</b> a big screen with a huge countdown number in the centre and a small shade map underneath. Labels: "big number = minutes until bus", "green = shaded seat".</p><p><b>Idea 2 (sketch):</b> a phone-app home screen with a bus icon moving along a route line and a "Find a cool spot" button.</p>`,
        `<p>I chose <b>Idea 1</b> because it meets all 5 of my success criteria. It works for passengers without phones, and the large number can be read from 2 metres. Idea 2 only helps people who have the app.</p>`,
        `<p><b>Planning drawing (labelled):</b> title bar at the top in navy with "Seaview Stop"; countdown box in the centre with white numbers; shade map bottom-left; next three buses bottom-right.</p><p><b>What I need:</b> Canva for the layout, free icons, screen size 1920 × 1080 pixels, two lessons.</p>`
      ]
    },
    "7": {
      A: [
        `<p><b>The problem:</b> Coach Sara runs an under-12 football club. She wants to record training and show players their mistakes, but shop websites use confusing terms such as GB, GHz and mAh, so she does not know which tablet to buy.</p><p><b>Target audience:</b> sports coaches with little technical knowledge.</p><p><b>Why it matters:</b> a wrong choice wastes money — with too little storage, videos cannot be saved. A clear guide would let coaches decide in minutes.</p>`,
        `<table><tr><th>Research question</th><th>Primary / secondary</th><th>How</th><th>Priority</th></tr><tr><td>How long does the coach record each session?</td><td>Primary</td><td>Interview</td><td>1</td></tr><tr><td>How much storage does 1 hour of HD video need?</td><td>Secondary</td><td>Manufacturer websites</td><td>2</td></tr><tr><td>Which battery lasts a 2-hour session?</td><td>Secondary</td><td>Product reviews</td><td>3</td></tr><tr><td>Which words confuse coaches?</td><td>Primary</td><td>Survey of 5 coaches</td><td>4</td></tr></table><p class="note">Recording time is first because it decides the storage and battery she needs.</p>`,
        `<table><tr><th>Existing guide</th><th>Strengths</th><th>Weaknesses</th><th>Idea I can use</th></tr><tr><td>An electronics shop's comparison page</td><td>Filters by price</td><td>Full of technical terms</td><td>Use filters, but explain every term</td></tr><tr><td>A "which tablet?" video review</td><td>Shows real use</td><td>15 minutes long</td><td>Keep my guide short</td></tr><tr><td>A manufacturer's comparison chart</td><td>Side-by-side specs</td><td>Only one brand</td><td>Compare several brands</td></tr></table>`,
        `<p><b>Findings:</b> the coach records about 2 hours per session; 1 hour of HD video uses roughly 8 GB; she needs a battery that lasts more than 3 hours; coaches did not understand "GHz" or "mAh".</p><p><b>Design brief:</b> I am going to design an interactive buyer's guide for sports coaches because they need to choose a tablet quickly without technical knowledge. It will explain storage, battery, screen and processor in plain words.</p>`
      ],
      B: [
        `<table><tr><th>Area</th><th>Success criterion</th><th>Test</th></tr><tr><td>Look</td><td>An icon beside every hardware term</td><td>Check each term</td></tr><tr><td>Function</td><td>The user answers 3 questions and gets a recommendation</td><td>A tester finishes in under 2 minutes</td></tr><tr><td>User</td><td>Every confusing word from my survey is explained</td><td>The coach reads it and confirms</td></tr><tr><td>Content</td><td>Covers storage, battery, screen and processor</td><td>Checklist</td></tr><tr><td>Accessibility</td><td>Body text at least 18 pt</td><td>Measure the text</td></tr></table>`,
        `<p><b>Idea 1:</b> a quiz-style guide — three questions, then a result screen. <b>Idea 2:</b> a one-page infographic comparing three tablets. <b>Idea 3:</b> a slide-by-slide tour of each component. Each sketch is labelled with buttons, icons and colours.</p>`,
        `<p>I chose <b>Idea 1</b> because it meets all 5 criteria: it gives a personal recommendation and takes under 2 minutes. Idea 2 was too crowded to read on a tablet, and Idea 3 was too long for a busy coach.</p>`,
        `<p><b>Storyboard:</b> Screen 1 welcome → Screen 2 "How long do you record?" (3 buttons) → Screen 3 "What is your budget?" → Screen 4 result card explaining storage and battery → Screen 5 glossary of terms.</p><p><b>Requirements:</b> Google Slides with hyperlinked buttons, an icon set, three lessons. Step 1: build all screens; Step 2: add links; Step 3: test with a classmate.</p>`
      ]
    },
    "8": {
      A: [
        `<p><b>The problem:</b> Paws & Bubbles takes every booking by phone. Layla, the owner, misses about 15 calls a week while she is grooming, and customers cannot see prices before they call.</p><p><b>Client and audience:</b> Layla (owner); pet owners aged 25–50 in the neighbourhood, most of whom browse on phones.</p><p><b>Justification:</b> each missed call is a lost booking. In my survey, 7 out of 10 pet owners said they would rather book online, and two nearby competitors already have booking websites.</p>`,
        `<table><tr><th>Research question</th><th>Type</th><th>Method / source</th><th>Priority and reason</th></tr><tr><td>Which services and prices should the site show?</td><td>Primary</td><td>Interview with Layla</td><td>1 — the site cannot exist without this content</td></tr><tr><td>How do customers prefer to book?</td><td>Primary</td><td>Survey of 10 pet owners</td><td>2 — decides the booking feature</td></tr><tr><td>What do competitor sites offer?</td><td>Secondary</td><td>Two local groomer websites</td><td>3 — shows the minimum standard</td></tr><tr><td>What makes a site easy to use on a phone?</td><td>Secondary</td><td>Web design guidance articles</td><td>4 — most users are on phones</td></tr></table>`,
        `<table><tr><th>Website</th><th>Audience</th><th>Strengths</th><th>Weaknesses</th><th>Inspiration</th></tr><tr><td>A national pet-store chain's grooming page</td><td>Busy pet owners</td><td>Online booking, clear price list</td><td>Cluttered with product adverts</td><td>A clear price table and a booking button</td></tr><tr><td>An independent groomer's site</td><td>Local customers</td><td>Friendly photos of real pets</td><td>No prices; breaks on phones</td><td>Real photos; must be responsive</td></tr><tr><td>A hair-salon booking site</td><td>Salon customers</td><td>Calendar booking and reminders</td><td>Not designed for pets</td><td>A simple time-slot calendar</td></tr></table><p class="note">Comparison: the chain is easiest to book but impersonal; the independent site feels friendly but is hard to use. My design should combine both.</p>`,
        `<p><b>Design brief.</b> Client: Layla, Paws & Bubbles. Problem: missed bookings and hidden prices. Key findings: 7/10 owners prefer online booking; most use phones; competitors show prices and booking. Constraints: four lessons, a free website builder, Layla's own photos. Goal: a responsive four-page website with a clear price list and a booking request form.</p>`
      ],
      B: [
        `<table><tr><th>Area</th><th>Specification point</th><th>Linked to research</th><th>Test</th></tr><tr><td>Function</td><td>A "Book now" button on every page</td><td>7/10 prefer online booking</td><td>Check each page</td></tr><tr><td>Function</td><td>The booking form sends to Layla's email</td><td>Interview</td><td>Submit a test booking</td></tr><tr><td>Content</td><td>Full price list on the Services page</td><td>Competitor analysis</td><td>Compare with Layla's list</td></tr><tr><td>User</td><td>Works on a 375-pixel-wide phone screen</td><td>Most users are on phones</td><td>Test on a phone</td></tr><tr><td>Aesthetics</td><td>Uses the salon's teal and white colours</td><td>Interview</td><td>Colour check</td></tr><tr><td>Accessibility</td><td>Every image has alt text</td><td>Web guidance</td><td>Inspect each image</td></tr></table>`,
        `<p><b>Idea 1:</b> a full-width photo hero with a "Book now" button. <b>Idea 2:</b> a split homepage — price list on the left, booking calendar on the right. <b>Idea 3:</b> a card grid of services, each with its own booking button. Each wireframe is annotated with sizes, colours and fonts.</p>`,
        `<table><tr><th>Idea</th><th>Meets spec?</th><th>Strength</th><th>Weakness</th></tr><tr><td>1</td><td>5/6</td><td>Friendly and simple</td><td>Prices are one click away</td></tr><tr><td>2</td><td>4/6</td><td>Everything on one screen</td><td>Too cramped on phones</td></tr><tr><td>3</td><td>6/6</td><td>Prices and booking together</td><td>More pages to build</td></tr></table><p>I chose <b>Idea 3</b> because it meets all six specification points and works well on phones.</p>`,
        `<p><b>Site map:</b> Home → Services and prices → Book → About us → Contact.</p><p><b>Wireframe:</b> navigation bar (logo left, menu right, 80 px high); service cards in 3 columns on a laptop and 1 column on a phone; footer with opening hours.</p><p><b>Requirements:</b> Google Sites, the Poppins font, teal #1A9E9A, 8 photos from Layla, 4 lessons.</p>`
      ]
    },
    "10": {
      A: [
        `<p><b>The problem:</b> the library lends about 40 laptops, cameras and graphing calculators using a paper sign-out sheet. Last term 6 items went missing (worth about AED 9,000), and Mrs. Khan spends around 30 minutes a day chasing late returns.</p><p><b>Client and stakeholders:</b> Mrs. Khan (librarian); students and teachers who borrow; the IT technician who maintains devices; the finance office that replaces losses.</p><p><b>Justification:</b> losses cost money, chasing wastes staff time, and students cannot see whether equipment is available. Paper records cannot show patterns such as which items are most often late, so a digital system with accurate, secure data is needed.</p>`,
        `<table><tr><th>Research question</th><th>Type</th><th>Method &amp; source</th><th>Priority</th><th>Justification</th></tr><tr><td>What data must be recorded for each loan?</td><td>Primary</td><td>Interview with Mrs. Khan</td><td>1</td><td>Defines the whole data structure</td></tr><tr><td>Who needs to see which data?</td><td>Primary</td><td>Interviews with stakeholders</td><td>2</td><td>Decides privacy and access</td></tr><tr><td>What loan rules apply?</td><td>Primary</td><td>Library policy document</td><td>3</td><td>Validation rules</td></tr><tr><td>How do existing loan systems work?</td><td>Secondary</td><td>Product websites, demos</td><td>4</td><td>Avoid reinventing features</td></tr><tr><td>What does data-protection law require for student data?</td><td>Secondary</td><td>UAE data-protection guidance</td><td>5</td><td>Legal constraint</td></tr></table><p class="note">Reflection: question 1 comes first because every later decision depends on the fields being right.</p>`,
        `<table><tr><th>System</th><th>Who uses it</th><th>Key features</th><th>Strengths</th><th>Limitations</th><th>Implication</th></tr><tr><td>A commercial library management system</td><td>Large libraries</td><td>Barcode scanning, overdue emails</td><td>Automated and reliable</td><td>Expensive; built for books</td><td>Include automatic overdue alerts</td></tr><tr><td>A spreadsheet loan template</td><td>Small teams</td><td>Simple table and filters</td><td>Free and easy to edit</td><td>No validation; easy to overwrite</td><td>Add an input form with validation</td></tr><tr><td>Self-checkout in a supermarket</td><td>Shoppers</td><td>Scan, confirm, receipt</td><td>Very fast</td><td>Needs dedicated hardware</td><td>Use QR codes scanned by phone</td></tr></table><p>Analysis: the strongest systems separate data entry from data storage and use automation for reminders. Free tools lack validation, which causes the errors seen on the paper sheet.</p>`,
        `<p><b>Detailed design brief.</b> Context: a secondary-school library lending 40 high-value items. Analysis: losses come from missing return dates and unreadable handwriting; stakeholders need different views; automated reminders reduce chasing. Constraints: free school software only, built in 5 lessons, student data visible only to library staff. Goal: a data system with a validated loan form, linked Items/Borrowers/Loans tables and a dashboard of current and overdue loans.</p>`
      ],
      B: [
        `<table><tr><th>Area</th><th>Specification point</th><th>Justification</th><th>Measurable test</th></tr><tr><td>Data</td><td>Each loan stores item ID, borrower ID, loan date and due date</td><td>Interview</td><td>Inspect the Loans table</td></tr><tr><td>Validation</td><td>Item ID must exist in the Items table</td><td>Paper-sheet errors</td><td>Enter a false ID — it is rejected</td></tr><tr><td>Automation</td><td>Due date = loan date + 7 days</td><td>Library policy</td><td>Check 5 records</td></tr><tr><td>Output</td><td>Dashboard shows overdue items in red</td><td>Reduce chasing time</td><td>Overdue test record shows in red</td></tr><tr><td>Privacy</td><td>Only staff accounts can view borrower details</td><td>Data-protection law</td><td>Log in as a student — no access</td></tr><tr><td>Usability</td><td>A loan is recorded in under 30 seconds</td><td>Librarian workload</td><td>Time three loans</td></tr></table>`,
        `<p><b>Idea 1:</b> an online form feeding a spreadsheet, with a chart dashboard. <b>Idea 2:</b> a relational database with separate forms and a report view. <b>Idea 3:</b> QR stickers on every item; scanning opens a pre-filled form linked to a dashboard. Each concept is annotated with data flow, users and tools.</p>`,
        `<table><tr><th>Criterion</th><th>Weight</th><th>Idea 1</th><th>Idea 2</th><th>Idea 3</th></tr><tr><td>Validation</td><td>3</td><td>2</td><td>5</td><td>4</td></tr><tr><td>Speed of loan</td><td>3</td><td>3</td><td>3</td><td>5</td></tr><tr><td>Privacy</td><td>2</td><td>3</td><td>5</td><td>4</td></tr><tr><td>Feasibility</td><td>2</td><td>5</td><td>3</td><td>4</td></tr><tr><td><b>Total</b></td><td></td><td>31</td><td>40</td><td><b>45</b></td></tr></table><p>I chose <b>Idea 3</b>. It scores highest on the weighted matrix, mainly because QR scanning meets the 30-second target and removes typing errors. I will add Idea 2's linked-table structure to improve validation.</p>`,
        `<p><b>Data structure:</b> Items(ItemID PK, Type, Serial, Status) · Borrowers(BorrowerID PK, Name, Role, Email) · Loans(LoanID PK, ItemID FK, BorrowerID FK, LoanDate, DueDate, Returned Y/N).</p><p><b>Data flow:</b> scan QR → pre-filled form → Loans table → dashboard and overdue email.</p><p><b>Requirements:</b> school Google/Microsoft account, a QR generator, printed labels, 5 lessons; a test plan of 10 records.</p>`
      ]
    }
  },

  /* ---------------- EXERCISE QUESTION BANKS ---------------- */
  exercises: {
    A: [
      { y: 1, type: "mcq", q: "Which is the best problem statement?", o: ["I want to make an app.", "Grade 6 students forget homework because they have no simple way to check tasks at home.", "Apps are cool.", "Phones are useful for everything."], a: 1, h: "A good problem statement says WHO has the problem and WHAT the problem is.", w: "It names the people affected and the exact problem." },
      { y: 1, type: "mcq", q: "What does 'justify the need' mean?", o: ["Draw the product", "Give reasons and evidence for why the problem matters", "List the materials", "Choose a colour scheme"], a: 1, h: "Justify = give reasons, ideally with evidence.", w: "Justifying means proving the problem is worth solving." },
      { y: 1, type: "mcq", q: "A target audience is…", o: ["everyone in the world", "the specific group of people your solution is designed for", "your teacher", "the people who make the product"], a: 1, h: "Think: who will actually USE your design?", w: "Designers design for a specific group." },
      { y: 1, type: "order", q: "Put the MYP design cycle in order.", items: ["Inquiring and analysing", "Developing ideas", "Creating the solution", "Evaluating"], h: "You research before you design, and test at the end.", w: "A → B → C → D." },
      { y: 1, type: "classify", q: "Sort these research questions into Strong or Weak.", cats: ["Strong", "Weak"], items: [["What features do our users use most?", 0], ["Is design fun?", 1], ["What budget does the client have?", 0], ["What is my favourite colour?", 1], ["What do similar products do badly?", 0]], h: "A strong question changes what you design.", w: "Strong questions affect design decisions." },
      { y: 1, type: "mcq", q: "Which is the most useful description of an existing product?", o: ["It's good.", "It's blue and nice.", "Its large buttons make it easy for older users, but it does not work offline, so my design should work without Wi-Fi.", "I don't like it."], a: 2, h: "Look for a strength, a weakness AND what it means for YOUR design.", w: "It links the product to a design decision." },
      { y: 2, type: "classify", q: "Sort these into Primary or Secondary research.", cats: ["Primary", "Secondary"], items: [["Interviewing your client", 0], ["Reading a government report", 1], ["Surveying 10 users", 0], ["Watching a product review video", 1], ["Testing an existing product yourself", 0], ["Reading statistics on a website", 1]], h: "Primary = YOU collect it first-hand. Secondary = someone else already published it.", w: "Primary is first-hand; secondary is already published." },
      { y: 2, type: "mcq", q: "Which is a secondary research method?", o: ["Interviewing a user", "Running a survey", "Observing people using a product", "Reading an online review article"], a: 3, h: "Which one did someone else already write?", w: "Reading published material is secondary research." },
      { y: 3, type: "mcq", q: "Why do designers prioritise their research?", o: ["To make the list look longer", "To spend time first on the questions that most affect the design", "Because the teacher says so", "To avoid doing primary research"], a: 1, h: "Time is limited — what should come first?", w: "Priorities focus effort where it matters most." },
      { y: 3, type: "mcq", q: "What belongs in a design brief?", o: ["Only a sketch", "A summary of the problem, the client or audience and the key research findings", "The final product photo", "A list of your favourite websites"], a: 1, h: "A brief summarises everything Criterion A found out.", w: "The brief bridges research and design." },
      { y: 3, type: "mcq", q: "'Analyse' an existing product means…", o: ["describe its colour", "break it down to explain why its features work or fail for its users", "copy it", "say whether you like it"], a: 1, h: "Analysis explains WHY, not just WHAT.", w: "Analysis looks at reasons and effects." },
      { y: 5, type: "mcq", q: "Which secondary source is most reliable for statistics?", o: ["An anonymous blog", "A recent report from a government or UN agency", "A social media comment", "An advertisement"], a: 1, h: "Who has the authority and the data?", w: "Official recent reports are the most reliable." },
      { y: 5, type: "mcq", q: "Which statement is an ethical consideration for a design brief?", o: ["The dashboard will be blue", "Users' personal data will be stored securely and seen only by staff who need it", "The system will have 5 tables", "It will be finished in 5 lessons"], a: 1, h: "Ethics is about doing right by the people affected.", w: "Data privacy is an ethical consideration." },
      { y: 5, type: "mcq", q: "Which is QUANTITATIVE evidence of a need?", o: ["Staff said it is annoying", "6 items were lost last term, costing AED 9,000", "It seems like a problem", "Everyone knows it's bad"], a: 1, h: "Quantitative = numbers.", w: "Numbers make a stronger justification." }
    ],
    B: [
      { y: 1, type: "mcq", q: "A good success criterion is…", o: ["It looks nice", "Something you can check or test, such as 'text can be read from 2 metres'", "It is the best", "Everyone will love it"], a: 1, h: "Could you prove it with a test?", w: "Success criteria must be testable." },
      { y: 1, type: "classify", q: "Sort these into Testable or Not testable.", cats: ["Testable", "Not testable"], items: [["Looks nice", 1], ["Loads in under 3 seconds", 0], ["Uses 3 colours or fewer", 0], ["Is amazing", 1], ["Fits a phone screen 375 px wide", 0]], h: "Testable criteria have a number or a clear check.", w: "Numbers and checks make criteria testable." },
      { y: 1, type: "mcq", q: "What makes a design idea 'feasible'?", o: ["It is the most expensive", "It can actually be made with the time, skills, tools and budget available", "It is very original", "It has the most colours"], a: 1, h: "Feasible = possible to make.", w: "Feasibility means it can really be built." },
      { y: 1, type: "mcq", q: "Why do we annotate design sketches?", o: ["To fill space", "So others can correctly understand features, sizes, colours and how it works", "To make them colourful", "Because sketches are hard to see"], a: 1, h: "Ideas must be 'correctly interpreted by others'.", w: "Annotations explain the idea to others." },
      { y: 1, type: "mcq", q: "A planning drawing should include…", o: ["only a title", "labels, sizes, colours or materials and the main details", "a photo of the finished product", "your name only"], a: 1, h: "Could someone else make it from your drawing?", w: "Planning drawings carry the details for making." },
      { y: 2, type: "mcq", q: "What is the best way to choose your final design?", o: ["Pick your favourite", "Compare each idea against your success criteria", "Pick the first one you drew", "Ask a friend to choose"], a: 1, h: "Use the criteria you already wrote.", w: "Criteria make the choice objective." },
      { y: 2, type: "mcq", q: "A 'range' of design ideas means…", o: ["the same idea in three colours", "several ideas that are genuinely different from each other", "one very detailed idea", "ideas copied from the internet"], a: 1, h: "Different layouts, approaches or features.", w: "A range shows genuinely different thinking." },

  D: [
    `<table><tr><th>Specification point</th><th>Test method</th><th>Who / sample</th><th>Data collected</th></tr><tr><td>Book button on every page</td><td>Checklist of every page</td><td>Me and one peer</td><td>Yes/no per page</td></tr><tr><td>Form sends to Layla</td><td>Submit 3 test bookings</td><td>Layla</td><td>Number received</td></tr><tr><td>Works on 375 px</td><td>Open every page on a phone</td><td>Two different phones</td><td>Pass/fail per page</td></tr><tr><td>Booking takes under 1 minute</td><td>Timed task</td><td>5 pet owners</td><td>Seconds</td></tr><tr><td>Loads in under 3 s</td><td>Page-speed tool</td><td>Home page, 3 runs</td><td>Seconds</td></tr><tr><td>Every image has alt text</td><td>Inspect each image</td><td>Me</td><td>Count</td></tr></table><p class="note">Survey: "How easy was booking (1–5)?", "Was anything confusing?", "Would you book this way again?"</p>`,

    `<p><b>Finished system:</b> scanning an item's QR code opens a pre-filled form; the loan appears in the Loans sheet with its due date; the dashboard shows current loans, overdue items in red and a chart by type. It functions as intended with 10 test records. It is presented appropriately: the dashboard fits one laptop screen and is the first tab Mrs. Khan sees, and staff-only tabs are hidden from student view.</p>`,
    `<table><tr><th>Change</th><th>Justification (evidence)</th><th>Impact on specification</th></tr><tr><td>Overdue emails replaced by a red-highlight list Mrs. Khan checks daily</td><td>The school account blocks scripts that send email automatically</td><td>The "overdue alert" point is still met, but manually</td></tr><tr><td>Added a "Condition on return" field</td><td>The IT technician asked to track damage</td><td>New point added: damage is recorded</td></tr><tr><td>Testing took 2 lessons, not 1</td><td>The validation rule failed with mixed-case IDs</td><td>Fixed with UPPER(), improving data accuracy</td></tr></table>`

    `<table><tr><th>Specification point</th><th>Result</th><th>Met?</th></tr><tr><td>Under 30 s</td><td>Average 22 s (range 15–41 s)</td><td>Mostly</td></tr><tr><td>Invalid IDs rejected</td><td>5 of 5 rejected</td><td>Yes</td></tr><tr><td>Due date</td><td>10 of 10 correct</td><td>Yes</td></tr><tr><td>Overdue red</td><td>3 of 3</td><td>Yes</td></tr><tr><td>Privacy</td><td>No access</td><td>Yes</td></tr><tr><td>Totals accurate</td><td>0 difference</td><td>Yes</td></tr></table><p>The system meets five points fully and one mostly. The 41-second loan was the first attempt by a student who had never used QR scanning, so speed improves with familiarity. A limitation is that testing lasted two weeks with only 15 loans; a full term would give more reliable evidence about losses. The manual overdue check also depends on Mrs. Khan remembering to look.</p>`,
    `<table><tr><th>Weakness (evidence)</th><th>Improvement</th><th>How</th></tr><tr><td>Overdue alerts are manual</td><td>Automatic reminder emails</td><td>Ask IT to approve a script</td></tr><tr><td>First-time users slower (41 s)</td><td>Instruction poster beside the QR codes</td><td>Three-step visual guide</td></tr><tr><td>No history of item faults</td><td>Fault report chart</td><td>Pivot on "Condition on return"</td></tr></table><p class="note">Priority: automatic reminders first, because they remove the biggest risk — overdue items being missed.</p>`,
    `<p>Mrs. Khan reports chasing time fell from about 30 minutes a day to about 5, and no items were lost during the two-week trial. Students can now see which equipment is available, which makes borrowing fairer. Teachers can plan lessons knowing laptops will be returned. Ethically, borrower data is now protected, while the old paper sheet could be read by anyone. In the long term, fewer lost devices saves money and reduces e-waste (SDG 12).</p><p class="note">Mrs. Khan: "For the first time I know exactly where every laptop is."</p>`

/* ---------------- WORKED EXAMPLES — GRADE 7 (Switch Off Standby campaign) ---------------- */
COURSE.examples["7"] = {
  A: [
    `<p><b>The problem:</b> in many homes, TVs, consoles and chargers are left on standby all day and night. They waste electricity even when nobody is using them.</p><p><b>Target audience:</b> families with many devices at home, reached through students.</p><p><b>Why it matters:</b> standby power can make up a noticeable part of a home's electricity bill, and in the UAE most electricity still comes from burning gas. Families often don't know it happens, so an awareness campaign could change habits quickly and cheaply.</p>`,
    `<table><tr><th>Research question</th><th>Primary / secondary</th><th>How</th><th>Priority</th></tr><tr><td>How many devices do our families leave on standby?</td><td>Primary</td><td>Survey of 20 students</td><td>1</td></tr><tr><td>How much energy does standby waste?</td><td>Secondary</td><td>Energy-agency websites</td><td>2</td></tr><tr><td>What kind of message makes teenagers act?</td><td>Primary</td><td>Show 3 sample posters to classmates</td><td>3</td></tr><tr><td>What have other energy campaigns done?</td><td>Secondary</td><td>Look at real campaigns online</td><td>4</td></tr></table><p class="note">The survey comes first because it proves the problem exists in our own community.</p>`,
    `<table><tr><th>Existing campaign</th><th>Strengths</th><th>Weaknesses</th><th>Idea I can use</th></tr><tr><td>Earth Hour</td><td>Simple action, global reach</td><td>Only one hour a year</td><td>A simple, clear action</td></tr><tr><td>A local electricity provider's saving tips</td><td>Real local numbers</td><td>Lots of small text</td><td>Use local facts, but in big visuals</td></tr><tr><td>A school "switch off" sticker campaign</td><td>A reminder where the action happens</td><td>Plain design</td><td>Put stickers or QR codes near plugs</td></tr></table>`,

  B: [

    `<p><b>Idea 1:</b> a "Vampire Devices" theme — cartoon chargers draining energy at night. <b>Idea 2:</b> a money theme — "Your TV costs you money while you sleep." <b>Idea 3:</b> a planet theme — a melting globe plugged into a socket. Each poster sketch is labelled with headline, image, facts and call to action.</p>`,
    `<p>I chose <b>Idea 1</b> because it meets all 6 criteria. Classmates remembered the "vampire" message best (4 of 5), and it works for both children and parents. Idea 3 was less clear about the action, and Idea 2 did not appeal to students.</p>`,
    `<p><b>Poster layout:</b> headline at the top "Stop the Energy Vampires!", the cartoon charger in the centre, 3 facts with icons below, and the call to action "Switch off at the wall" in a red banner.</p><p><b>Video storyboard (6 frames, 45 s):</b> dark room → glowing devices → vampire appears → fact on screen → a student switches off → logo and call to action.</p><p><b>Requirements:</b> Canva, copyright-free images, my own voice-over, 4 lessons.</p>`

  C: [

  A: [
    `<p><b>The problem:</b> the café sells about 300 cups of coffee a day. Customers rarely think about where the beans come from, how they travel or what happens to the cups. Coffee grown in Ethiopia or Colombia travels over 10,000 km, and each cup has a large hidden water footprint.</p><p><b>Client and audience:</b> the café owner, who wants to promote her new reusable-cup discount; her regular customers, mostly office workers aged 25–45.</p><p><b>Justification:</b> in a quick survey, 18 of 20 customers could not name the country their coffee came from, and only 3 brought a reusable cup. Revealing the hidden journey connects a daily choice to global systems (globalization and sustainability) and could change behaviour at the counter.</p>`,
    `<table><tr><th>Research question</th><th>Type</th><th>Method &amp; source</th><th>Priority</th><th>Justification</th></tr><tr><td>Where do the café's beans come from and how do they travel?</td><td>Primary</td><td>Interview with the owner; supplier invoices</td><td>1</td><td>The story depends on real data</td></tr><tr><td>What do customers already know?</td><td>Primary</td><td>Survey of 20 customers</td><td>2</td><td>Sets the starting point</td></tr><tr><td>What is the water and carbon footprint of a cup?</td><td>Secondary</td><td>Peer-reviewed or NGO footprint data</td><td>3</td><td>Credible numbers</td></tr><tr><td>How do other brands reveal product origins?</td><td>Secondary</td><td>Product websites, packaging</td><td>4</td><td>Existing solutions</td></tr></table><p class="note">The interview comes first because inventing a journey would make the whole solution inaccurate.</p>`,

  B: [

    `<p><b>Idea 1:</b> an illustrated world map with a dotted journey line. <b>Idea 2:</b> a "cup timeline" that unrolls from left to right. <b>Idea 3:</b> a 3D layered model of a cup with each layer showing a stage. Each concept is annotated with content, size, materials and how it links to the video.</p>`,

    `<p>Screenshots and a screencast show the layout grid at exact size, custom icons built from shapes, consistent colours from a five-colour palette, data checked against two sources, and the video timeline with captions, a voice-over at a consistent level and 5-second cuts matching the storyboard.</p>`,
    `<p><b>Finished solution:</b> a printed 40 × 30 cm journey timeline and a 45-second captioned loop on the café screen. It functions as intended: in testing, 7 of 8 customers stated the main message in under 30 seconds. Evidence is presented as photographs and screenshots, not links.</p>`,
    `<table><tr><th>Change</th><th>Justification (evidence)</th><th>Impact on specification</th></tr><tr><td>Reduced the stages from 7 to 6</td><td>Testers took 41 s with 7 stages</td><td>The readability point is now met</td></tr><tr><td>Added a QR-free "ask the barista" prompt</td><td>Customers didn't want to scan codes</td><td>Supports the behaviour-change point</td></tr></table>`

    `<p>All points were met except behaviour, which was partly met: reusable cups rose from 3% to 7% of sales. That is a real increase, but one week is short and other factors (the weather, a discount email) may have contributed, so the evidence is promising rather than conclusive.</p>`,

    `<p>Customers now see the global system behind a daily habit, and reusable-cup use more than doubled during the trial. The owner can link her discount to a clear story. Long term, this could reduce cup waste and make customers more curious about sourcing. A possible negative is "information fatigue" if too many facts are added, so the design deliberately keeps one clear message.</p>`

/* decision → what the student is designing */
COURSE.focusFrom = function(g, f){
  f = f || {};
  const val = x => String(x || "").trim(), own = val(f.a4own);
  if (g === "8") return val(f.a4name) ? `a website for ${val(f.a4name)}` : "";
  let what = val(f.a4what);
  if (what === OWN) what = own && !/^n\/?a$/i.test(own) ? own : "";
  if (g === "10" && what) return val(f.a4product) ? `${what} — ${val(f.a4product)}` : what;
  return what;
};

Object.keys(UNITS).forEach(g => {
  const gd = COURSE.grades[g]; if (!gd) return;
  Object.assign(gd, { key: g, u: UNITS[g], product: UNITS[g].productNoun, ideaLabel: UNITS[g].designNoun, planLabel: "developed design" });
  delete gd.choose; delete gd.tasks;
});

/* ---------- the task builder ---------- */
COURSE.buildTasks = function(c, gd){
  const Y = Yk(gd.myp), n = NUM[Y], W = x => Math.max(5, Math.round(x * n.w / 2)), u = gd.u, L = gd.lab || { tools: [], milestones: ["Early stage", "Middle stage", "Final stage"], skills: [] };
  if (c === "A") return [
    [ T("a1what", u.q1, W(40)),
      T("a1why", "Why is this a problem? Give at least 2 reasons, each supported by a fact, statistic or example with its source.", W(50)),
      T("a1who", "Who does this problem affect, and how does it affect them?", W(40)),
      T("a1none", "Why has this problem not been solved yet? What do existing products or solutions miss?", W(40)),
      T("a1if", "What will happen if nothing is done?", W(25)),
      TB("a1src", `Sources you used (at least ${n.src}). Every fact or statistic needs a source.`, ["Source title", "Link (https://…)", "What it told you"], n.src + 1, n.src, [null, "url", null]) ],
    [ TB("a2q", `List at least ${n.q} research questions that will help you understand the problem and the need for a solution. Include at least 2 questions about existing products or solutions.`, ["Research question", "Primary or secondary research?"], n.q + 2, n.q, [null, OPT("Primary", "Secondary")]) ],
    [ TB("a3t", "Justify and prioritise each research question", ["Research question", "Why do you need to know this? (justification)", "Where will you find the answer?", "Priority"], n.q + 2, n.q, [null, null, null, OPT("High", "Medium", "Low")]),
      T("a3top", "Which question is your top priority, and why?", W(30)) ],
    [ TB("a4f", `Your research findings: answer your most important questions (at least ${n.f})`, ["Research question", "What I found out", "Source (link, or who you asked)"], n.f + 2, n.f),
      ...u.decide(),
      T("a4brief", "Design brief: I am going to design… for… because… It will…", W(60)),
      RL("a4acc", "ACCESS FM: describe what your product will be like", "ACCESS FM", ["Aesthetics — how will it look?", "Cost — what will it cost, or what budget is there?", "Client / customer — who is it for?", "Environment — where will it be used, and how will it affect the environment?", "Size — how big is it, or how much content will it have?", "Safety — how will users be kept safe?", "Function — what will it do, and how will it work?", "Materials — what software, tools or materials will you use?"], ["My plan"]),
      T("a4look", "What will it look like, how will it work, and what are its main components?", W(40)) ]
  ];
  if (c === "B") {
    const D = Array.from({ length: n.d }, (_, i) => i + 1);
    return [
      [ TB("b1t", `Design specification: turn your design brief into at least ${n.spec} specific, measurable requirements`, ["ACCESS FM area", "Requirement (specific and measurable)", "How it will be tested"], n.spec + 2, n.spec, [OPT(...ACCESS_AREAS), null, null]) ],
      [ ...D.flatMap(k => [SK(`b2s${k}`, `Design ${k} — ${u.designNoun}. Same product and content as your other designs, in a different look. Label and annotate everything.`),
                           T(`b2n${k}`, `Design ${k}: explain your labels and annotations (layout, colours, fonts, features) and how it meets your specification`, W(40))]) ],
      [ RL("b3t", "Show your designs to your client. Which design principles do they like in each design, and why?", "Design", D.map(k => `Design ${k}`), ["Design principles the client likes (layout, colour, typography, balance, contrast, imagery…)", "The client's reasons"]),
        T("b3c", "What did your client say overall? Quote or summarise their feedback.", W(25)),
        T("b3s", "Which principles will you combine in your final design, and why?", W(40)) ],
      [ SK("b4s", `Final developed design — ${u.designNoun}. Label which ideas came from ${D.map(k => "Design " + k).join(", ")}.`),
        ...(Y >= 3 ? [SK("b4s2", "Developed design — second view, page or detailed drawing")] : []),
        T("b4n", "Explain your final design: what came from each earlier design, and why this is the best combination for your client", W(50)),
        TB("b4r", "What you need to create it", ["Requirement (software, materials, assets)", "Details (sizes, colours, fonts, quantities)"], 5, 4) ]
    ];
  }
  if (c === "C") return [
    [ TB("c1t", `Logical plan: a step-by-step instruction manual to bring your developed design to life (at least ${n.steps} steps). Every step must be SMART: specific, measurable, achievable, realistic and timely.`, ["Step number", "Detailed instruction (exactly what to do)", "Tools / resources", "Time (minutes)"], n.steps + 2, n.steps, ["num", null, null, "num"]),
      T("c1tot", "Total time, and how it fits into your lessons", 6) ],
    [ CH("c2tool", "Which software or tools did you use?", L.tools.map(t => t.name).concat(["Other"])),
      CL("c2k", `Tick the technical skills you used (at least ${n.skills})`, L.skills, Math.min(n.skills, L.skills.length)),
      ...L.milestones.flatMap((m, i) => [SK(`c2m${i}`, `Making evidence ${i + 1}: ${m}`, true), T(`c2q${i}`, `Evidence ${i + 1}: what did you do, which skills did you use, and which plan steps does it match?`, W(20))]),
      SK("c2f1", "Your finished solution — main view", true),
      SK("c2f2", "Your finished solution — second view or close-up", true),
      ...(gd.noUrls ? [] : [Object.assign(T("c2l", "Link to your solution (a full web address starting with https://, or write: not online)", 1), { fmt: "urlOrNone" })]) ],
    [ TB("c3t", "Did you follow your logical plan? Check each step from C.i against your making evidence in C.ii.", ["Plan step number", "Followed?", "Evidence (which screenshot shows it)"], n.steps + 2, n.steps, ["num", OPT("Yes", "Partly", "No"), null]),
      T("c3f", "Does your solution work as intended and match your developed design? Explain.", W(40)) ],
    [ TB("c4t", "Changes that were NOT in your design brief, specification or logical plan (if there were none, write 'No changes' in the first row)", ["What changed", "What the original plan or design said", "Why you made the change (justification)", "Effect on the solution"], 4, 1),
      T("c4o", "Overall, did your changes improve the solution? Explain.", W(25)) ]
  ];
  return [
    [ TB("d1t", `Test plan: at least ${n.tests} tests, one for each specification point from B.i`, ["Test name", "Specification point", "Testing method", "Expected result"], n.tests + 2, n.tests, [null, null, OPT("Survey", "Interview / detailed feedback", "Expert opinion", "Observation", "Experiment / functional test", "Measurement", "Checklist", "Timed task", "Comparison"), null]) ],
    [ TB("d2t", "Testing evidence: carry out every test and record the results", ["Specification", "Expected result", "Actual result", "Outcome", "Pass / Fail", "Qualitative or quantitative"], n.tests + 2, n.tests, [null, null, null, null, OPT("Pass", "Fail"), OPT("Qualitative", "Quantitative")]),
      SK("d2e", "Evidence of testing (screenshot, photo or survey results)", true) ],
    [ TB("d3t", "Suggested improvements", ["What failed or could be better", "Suggested improvement"], 4, 2) ],
    [ SK("d4s", "Your improved solution, with the improvements applied", true),
      T("d4h", "How does the improved solution work, and how does each improvement fix a failure from your tests?", W(50)),
      T("d4i", "What impact will the improved product have on your client and users?", W(50)) ]
  ];
};

const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

const b64e = u8 => btoa(String.fromCharCode(...u8));

async function hashPw(pw, saltB64){
  if (!(window.crypto && crypto.subtle)) throw new Error("Open the course from its https:// link to sign in.");
  const salt = saltB64 ? b64d(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:100000, hash:"SHA-256" }, key, 256);

}

function parseFormLink(link){

  if (!m) return null;
  const action = `https://docs.google.com/forms/d/${m[1]||""}${m[2]}/formResponse`;

  return entries.length ? { action, entries } : null;
}
async function postForm(link, values, keep){

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function loadLive(){
  const url = settings().controlCsv; if (!url) return;
  try {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "cb=" + Date.now());
    if (!r.ok) return;
    const rows = parseCSV(await r.text()); let state = null; const reqs = [];
    for (let i=1;i<rows.length;i++){
      const cell = rows[i].slice(1).find(v => v && v.trim().startsWith("{")); if (!cell) continue;
      try { const d = JSON.parse(cell);
        if (d.unlocks){ if (await verifyState(d) && (!state || String(d.t) > String(state.t))) state = d; }   // only admin-signed switch settings are trusted
        else if (d.request && d.request.email && SCHOOL.test(String(d.request.email))) reqs.push({ email:String(d.request.email), name:String(d.request.name||"").slice(0,80), salt:String(d.request.salt||""), hash:String(d.request.hash||""), t:String(d.request.t||"") }); } catch(e){}
    }
    REQUESTS = reqs;
    if (state){ const next = { unlocks: state.unlocks, teachers: state.teachers || [], declined: state.declined || [] };
      const changed = JSON.stringify(LIVE) !== JSON.stringify(next); LIVE = next; if (changed && !$("#modalRoot .modal")) render(); }
  } catch(e){ /* offline: keep the baked settings */ }
}

  if (!s.controlForm) return "local";
  if (!ADMIN_KEYS) return "failed";

/* ================= SEND WORK TO THE TEACHER'S PRIVATE SHEET ================= */
const CHUNK = 40000; // Google Sheets holds up to 50,000 characters per cell
function ctxFor(c){
  const u = user(); if (!u || u.role === "teacher") return null;
  const g = u.grade, gd = gradeData(g), sc = scenarioFor(session.email, g); if (!sc) return null;
  return { u, c, g, gd, cd: COURSE.criteria[c], p: prog(u, c), sc };
}
function workPayload(ctx, kind){
  const { c, g, gd, cd, p, sc } = ctx, Y = yearKey(gd.myp), F = fieldsFor(c, gd);
  return { v: 2, kind, at: new Date().toISOString(), g, c, myp: gd.myp, unit: gd.unit, cls: classLabel(ctx.u), grp: groupLabel(ctx.u),
    scenario: { title: sc.title, client: sc.client, user: sc.user, problem: sc.problem, brief: sc.brief },
    practice: { correct: p.ex.correct, points: p.ex.points, hints: p.ex.hints },
    strands: F.map((fs, i) => ({ n: ROMAN[i], strand: cd.strands[Y][i], done: !!p.done[i], self: p.bands[i] || "",
      fields: fs.map(f => { const v = p.fields[f.id];
        return { id: f.id, t: f.t, label: fill(f.label, g, sc), cols: f.cols, rowLabels: f.rowLabels, min: f.min,
          value: f.t === "sketch" ? (v ? "IMAGE" : "") : (v ?? "") }; }) })) };
}
function queueChunks(ctx, tag, id, text, extra){
  const u = ctx.u, n = Math.max(1, Math.ceil(text.length / CHUNK));
  for (let k = 0; k < n; k++){
    const head = ["DS1", tag, ctx.c, extra || "-", `${k+1}/${n}`, id].join("|");
    DB.queue.push([session.email, u.name, uLabel(ctx.g) + (classLabel(u) ? " · " + classLabel(u) : ""), u.teacher, "Criterion " + ctx.c, tag === "W" ? "Work data" : "Work image", "Student", head + "|" + text.slice(k*CHUNK, (k+1)*CHUNK), new Date().toISOString()]);
  }
}
function shrinkData(dataUrl, max){
  return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
    cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s); const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,cv.width,cv.height); x.drawImage(im, 0, 0, cv.width, cv.height);
    res(cv.toDataURL("image/jpeg", .6)); }; im.onerror = () => res(null); im.src = dataUrl; });
}
const lastSent = {};
async function sendWork(c, kind){
  if (session.preview || !settings().logForm) return;
  const ctx = ctxFor(c); if (!ctx) return;
  const payload = JSON.stringify(workPayload(ctx, kind));
  const key = c + kind; if (kind === "snapshot" && lastSent[key] === payload) return; lastSent[key] = payload;
  const id = Date.now().toString(36);
  queueChunks(ctx, "W", id, payload);
  if (kind === "submission"){
    for (const fs of fieldsFor(c, ctx.gd)) for (const f of fs){
      const v = ctx.p.fields[f.id]; if (f.t !== "sketch" || !v) continue;
      const small = await shrinkData(v, 800); if (!small) continue;
      queueChunks(ctx, "I", id, small.split(",")[1], f.id);
    }
  }
  save(); flushQueue();
}
let snapTimer = null;
function scheduleSnapshot(c){ clearTimeout(snapTimer); pendingSnap = c; snapTimer = setTimeout(() => { pendingSnap = null; sendWork(c, "snapshot"); }, 90000); }

/* ================= SECURITY CORE + SYNC ACROSS DEVICES =================
   Each student's work is locked (AES-256) with a random data key. That key is itself locked with a key
   made from the student's email + password (400,000 rounds), and a second copy is locked so that only the
   admin can open it (for password recovery). Everything is sent to a "Design Studio Sync" Google Form and
   read back from its sheet. The sheet holds only random IDs and locked text. */
const SYNC_CHUNK = 30000, SYNC_EVERY = 5000, KDF_ROUNDS = 400000;
const TE = new TextEncoder();
function syncCfg(){
