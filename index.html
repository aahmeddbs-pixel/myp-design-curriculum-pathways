  }
  modal(`<div class="stack"><div class="row" style="justify-content:space-between"><h2>${who==="admin"?"Admin panel":"Teacher tools"}</h2><button class="btn ghost sm" data-close>Close</button></div>
    <div class="tabs" role="tablist" style="flex-wrap:wrap">${tabs.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join("")}</div>${body}</div>`);
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => staffPanel(b.dataset.t, who));
  const result = (r, el) => $(el).innerHTML = r === "sent" ? `<div class="notice ok">Saved and sent. Every device will update within about 5 minutes.</div>` : r === "failed" ? `<div class="notice bad">Saved here, but Google Forms could not be reached. Check the internet connection and try again.</div>` : `<div class="notice warn">Saved on this device only. Connect live updates in Connect &amp; settings so other devices get the change.</div>`;
  if (tab === "switches"){
    document.querySelectorAll(".sw-t").forEach(b => b.onclick = () => { const on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on); U[b.dataset.g] = U[b.dataset.g] || {}; U[b.dataset.g][b.dataset.c] = on; });
    $("#pubSw").onclick = async () => { result(await publishState(st), "#swMsg"); render(); };
    $("#dlFile").onclick = () => downloadCourse(st);
    $("#previewBtn").onclick = () => { closeModal(); previewGradePicker(); };
  }
  if (tab === "teachers"){
    const after = async r => { const res = await publishState(st); staffPanel("teachers", who); result(res, "#tMsg"); };
    document.querySelectorAll("[data-ap]").forEach(b => b.onclick = () => { const r = pend.find(p => p.email === b.dataset.ap); st.teachers.push({ email:r.email, name:r.name, salt:r.salt, hash:r.hash }); st.declined = st.declined.filter(e => e !== r.email); after(); });
    document.querySelectorAll("[data-de]").forEach(b => b.onclick = () => { st.declined.push(b.dataset.de); after(); });
    document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { st.teachers = st.teachers.filter(t => t.email !== b.dataset.rm); st.declined.push(b.dataset.rm); after(); });
  }
  if (tab === "lookup"){
    document.querySelectorAll("[data-rs]").forEach(b => b.onclick = async () => { const temp = "Design" + Math.floor(1000 + Math.random()*9000); const u = DB.users[b.dataset.rs]; Object.assign(u, await hashPw(temp)); save();
      $("#rsMsg").innerHTML = `<div class="notice ok">New password for <b>${esc(u.name)}</b>: <code style="font-size:15px">${temp}</code> — give it to the student. Their work is kept.</div>`; });
  }
  if (tab === "setup"){
    const collect = async () => { const vl = {}; document.querySelectorAll("[data-vl]").forEach(i => { if (i.value.trim()) vl[i.dataset.vl] = i.value.trim(); });
      const v = { logForm: $("#setLog").value.trim(), controlForm: $("#setCtl").value.trim(), controlCsv: $("#setCsv").value.trim(), videoLinks: vl, adminHash: settings().adminHash };
      const np = $("#setPw").value; if (np){ if (np.length < 8) throw new Error("The admin password must be at least 8 characters."); v.adminHash = await hashPw(np); }
      return v; };
    const check = v => { const errs = []; if (v.logForm && !parseFormLink(v.logForm)) errs.push("The student log link is not a Google Forms pre-filled link (it should contain entry.)."); if (v.controlForm && !parseFormLink(v.controlForm)) errs.push("The switches form link is not a pre-filled link."); if (v.controlCsv && !/output=csv/.test(v.controlCsv)) errs.push("The published sheet link should end with output=csv."); if (v.logForm && parseFormLink(v.logForm)?.entries.length < 8) errs.push(`The log form has ${parseFormLink(v.logForm).entries.length} questions; 8 are expected. Extra details will be combined into the last question.`); return errs; };
    const fail = err => $("#setMsg").innerHTML = `<div class="notice bad">${esc(err.message)}</div>`;
    $("#saveSet").onclick = async () => { try { const v = await collect(), errs = check(v); DB.teacherSettings = v; save(); $("#setPw").value = ""; loadLive(); flushQueue(); $("#setMsg").innerHTML = errs.length ? `<div class="notice warn">${errs.map(esc).join("<br>")}</div>` : `<div class="notice ok">Settings saved on this device. Download the course file and upload it to GitHub so every device gets them.</div>`; } catch(err){ fail(err); } };
    $("#dlFile2").onclick = async () => { try { DB.teacherSettings = await collect(); save(); downloadCourse(courseState()); } catch(err){ fail(err); } };
    $("#testLog").onclick = async () => { const link = $("#setLog").value.trim(); if (!link) return $("#setMsg").innerHTML = `<div class="notice bad">Paste the student log form link first.</div>`;
      const ok = await postForm(link, ["test@sisd.ae","Test Student","Grade 8","Mr. Ahmed","Criterion A","Test entry","Student","If you can read this in your sheet, the connection works.", new Date().toISOString()]);
      $("#setMsg").innerHTML = ok ? `<div class="notice ok">Test sent. Check your Google Sheet for a row from "Test Student".</div>` : `<div class="notice bad">Could not reach Google Forms from here.</div>`; };
  }
}
function previewGradePicker(){
  modal(`<div class="stack"><h2>Preview as a student</h2><p class="muted" style="margin:0">Choose a grade. Every criterion opens for this preview only; no data is sent.</p>
    <div class="row">${Object.keys(COURSE.grades).map(g=>`<button class="btn sec" data-pg="${g}">${esc(gLabel(g))}</button>`).join("")}</div></div>`);
  document.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => {
    if (!session.preview) session.back = session.email;
    session.preview = true; session.email = PREVIEW;
    const pu = DB.users[PREVIEW] = DB.users[PREVIEW] || { role:"student", name:"Teacher Preview", teacher:"Mr. Ahmed", progress:{} };
    if (pu.grade !== b.dataset.pg){ pu.grade = b.dataset.pg; pu.progress = {}; }
    save(); closeModal(); go({ name:"home" });
  });
}
async function downloadCourse(st){
  const s = DB.teacherSettings || {};
  const cfg = { adminHash: s.adminHash || CONFIG.adminHash, unlocks: st.unlocks, teachers: st.teachers, declined: st.declined,
    logForm: s.logForm ?? CONFIG.logForm, controlForm: s.controlForm ?? CONFIG.controlForm, controlCsv: s.controlCsv ?? CONFIG.controlCsv, videoLinks: s.videoLinks || CONFIG.videoLinks || {} };
  try {
    const r = await fetch(location.href.split("#")[0], { cache:"no-store" }); if (!r.ok) throw 0;
    const src = await r.text();
    const a = src.indexOf("/*CONFIG-START*/"), b = src.indexOf("/*CONFIG-END*/");
    if (a < 0 || b < 0) throw 0;
    const out = src.slice(0, a) + "/*CONFIG-START*/\nconst CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n" + src.slice(b);
    await saveFile("index.html", new Blob([out], { type:"text/html" }), () => { const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([out], { type:"text/html" })); link.download = "index.html"; document.body.appendChild(link); link.click(); link.remove(); });
    toast("Course file downloaded as index.html — upload it to GitHub in place of the old one.", 5000);
  } catch(e){ toast("Open the course from its website link to download the file.", 5000); }
}

function modal(html){ $("#modalRoot").innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="card">${html}</div></div>`;
  $("#modalRoot .modal").addEventListener("click", e => { if (e.target.classList.contains("modal") || e.target.hasAttribute("data-close")) closeModal(); }); }
function closeModal(){ $("#modalRoot").innerHTML = ""; if (user()) render(); }

/* ================= BOOT ================= */
$("#staffLink").onclick = openStaff;
document.addEventListener("keydown", e => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "a"){ e.preventDefault(); openStaff(); } if (e.key === "Escape") closeModal(); });
$("#endPreview").onclick = () => { session.preview = false; session.email = session.back || null; session.back = null; go({ name:"home" }); };
if (DB.session && DB.users[DB.session] && DB.session !== PREVIEW && DB.users[DB.session].hash) session.email = DB.session;
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch(e){}
new MutationObserver(() => { cancelAnimationFrame(window.__lr); window.__lr = requestAnimationFrame(() => addListenButtons(document.getElementById("app"))); }).observe(document.getElementById("app"), { childList:true, subtree:true });
render(); loadLive(); flushQueue();
if (lang() !== "en") applyLang(lang(), true);
setInterval(() => { loadLive(); flushQueue(); }, 60000);
window.addEventListener("online", flushQueue);
})();

</script>
