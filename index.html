<style>
/* Layout: a design-journal workspace — navy masthead, criterion ring, strand tabs on graph paper */
:root{
  --navy:#1B2D4E; --red:#DC2B3E; --bg:#F3F5F9; --paper:#FFFFFF; --ink:#16223A; --muted:#5B6782;
  --line:#D8DEEA; --grid:rgba(27,45,78,.045); --soft:#E9EDF5; --ok:#1E8A55; --okbg:#E3F4EA; --warn:#B26A00; --warnbg:#FFF2DC; --bad:#C0283A; --badbg:#FBE5E8;
  --accent:#DC2B3E; --mast:#1B2D4E; --mastfg:#FFFFFF;
  --f-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --f-display: "Arial Black", Arial, "Helvetica Neue", sans-serif;
  --f-mono: "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --paper:#16213A; --ink:#E7ECF6; --muted:#9AA7C2; --line:#2A3858; --grid:rgba(255,255,255,.035); --soft:#1D2A47;
  --ok:#47C487; --okbg:#143326; --warn:#F0B44C; --warnbg:#3A2C10; --bad:#FF6B7C; --badbg:#3E1820; --accent:#FF5468; --mast:#0A1220; --mastfg:#FFFFFF; --navy:#8FB0E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --paper:#16213A; --ink:#E7ECF6; --muted:#9AA7C2; --line:#2A3858; --grid:rgba(255,255,255,.035); --soft:#1D2A47;
  --ok:#47C487; --okbg:#143326; --warn:#F0B44C; --warnbg:#3A2C10; --bad:#FF6B7C; --badbg:#3E1820; --accent:#FF5468; --mast:#0A1220; --mastfg:#FFFFFF; --navy:#8FB0E8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mast)}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* masthead */
.mast{background:var(--mast);color:var(--mastfg);position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-bottom:4px solid var(--red)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);letter-spacing:.02em;font-size:17px}
.brand .mk{width:34px;height:34px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-size:13px}
.brand small{display:block;font-family:var(--f-body);font-weight:normal;font-size:11px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.mast .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.12);color:var(--mastfg);border:0}
.chip.pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
main{padding-block:22px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:bold}
.btn{border:0;border-radius:8px;padding:10px 16px;background:var(--red);color:#fff;font-weight:bold;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:bold}
input[type=text],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;width:100%;font-weight:normal}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.notice{border-radius:8px;padding:10px 14px;font-size:14px}
.notice.ok{background:var(--okbg);color:var(--ok)}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.notice.bad{background:var(--badbg);color:var(--bad)}
/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.login{grid-template-columns:1fr}}
.hero h1{font-family:var(--f-display);font-size:clamp(28px,4.6vw,44px);color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--accent)}
.cycle-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.cycle-legend div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.cycle-legend b{font-family:var(--f-display);color:var(--accent);margin-right:6px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:9px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;font-weight:bold;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* dashboard */
.unitbar{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.unitbar>div{min-width:0;flex:1}
.unitbar h1{font-family:var(--f-display);font-size:clamp(22px,3.4vw,32px)}
.brief{border-left:4px solid var(--accent);background:var(--paper);padding:14px 16px;border-radius:0 8px 8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.crit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.crit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.crit-grid{grid-template-columns:1fr}}
.crit{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:190px}
.crit .L{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--accent)}
.crit.locked .L{color:var(--muted)}
.crit h3{font-size:16px}
.crit .state{margin-top:auto;font-size:12px;font-weight:bold;display:flex;align-items:center;gap:6px}
.crit.open{cursor:pointer;transition:transform .15s,box-shadow .15s}
.crit.open:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(27,45,78,.12)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
/* criterion stepper */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 auto;min-width:118px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;text-align:left;font-size:12px;display:flex;flex-direction:column;gap:2px}
.step b{font-size:13px}
.step .n{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.step[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.step.done .n::after{content:" ✓";color:var(--ok);font-weight:bold}
.step:disabled{opacity:.45;cursor:not-allowed}
.pane{margin-top:16px}
/* video */
.player{background:var(--mast);color:#fff;border-radius:var(--r);overflow:hidden;position:relative}
.stage{aspect-ratio:16/9;max-width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:center;padding:clamp(16px,4vw,40px);position:relative}
@media (max-width:600px){.stage{grid-template-columns:1fr;aspect-ratio:auto;min-height:360px}.stage svg{max-height:120px}}
.stage svg{width:100%;height:auto;max-height:260px}
.stage .txt{min-width:0}
.stage .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#FF8C99;font-weight:bold}
.stage h2{font-family:var(--f-display);font-size:clamp(18px,2.8vw,30px);margin:6px 0 10px;color:#fff}
.stage p{margin:0;font-size:clamp(13px,1.6vw,16px);color:#D9E2F2}
.scene-in{animation:sceneIn .6s ease both}
@keyframes sceneIn{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.controls{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.controls button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:7px 12px;font-weight:bold}
.controls .prog{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.controls .prog i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
.controls .tc{font-family:var(--f-mono);font-size:12px;color:#C9D3E6}
.ring-arc{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.scene-in,.ring-arc,.pulse{animation:none!important;stroke-dashoffset:0!important}}
/* content tables */
.model table,.tbl{border-collapse:collapse;width:100%;font-size:14px}
.model th,.model td,.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.model th,.tbl th{background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto;max-width:100%}
.model p{margin:.3em 0 .6em}
.model .note{font-size:13px;color:var(--muted);font-style:italic}
.strand-h{display:flex;gap:12px;align-items:baseline}
.roman{font-family:var(--f-display);color:var(--accent);font-size:20px;min-width:34px}
.why{background:var(--okbg);color:var(--ok);font-size:13px;padding:8px 12px;border-radius:7px}
.rub th:first-child,.rub td:first-child{width:70px;text-align:center;font-family:var(--f-mono)}
.rub tr.top td{background:var(--okbg)}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starters span{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:4px 9px;font-size:13px}
/* exercise */
.q{font-size:18px;font-weight:bold}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:11px 14px}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:var(--soft)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.ord li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);margin-bottom:6px}
.ord li span{flex:1;min-width:0}
.ord ol{padding:0;margin:0;list-style:none}
.cls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.cls-row span{flex:1;min-width:160px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px}
.field>.seg{align-self:flex-start}
#roleSeg button{padding:8px 20px;font-size:14px;font-weight:bold}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--paper)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:8px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--ok);border-color:var(--ok)}
/* main task */
.strand-tabs{display:flex;gap:6px;flex-wrap:wrap}
.strand-tabs button{border:1px solid var(--line);background:var(--paper);border-radius:8px 8px 0 0;padding:8px 14px;font-weight:bold;border-bottom:3px solid transparent}
.strand-tabs button[aria-selected=true]{border-bottom-color:var(--accent)}
.strand-tabs button.done::after{content:" ✓";color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px}
.field .lbl{font-weight:bold}
.counter{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter.ok{color:var(--ok)}
.tin input{border:0;width:100%;padding:6px 4px;background:transparent;min-width:110px}
.tin td{padding:0 4px}
.sk{border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:8px}
.sk canvas{width:100%;max-width:100%;aspect-ratio:4/3;background:#fff;border-radius:6px;border:1px solid var(--line);touch-action:none}
.sk img{border-radius:6px;border:1px solid var(--line);max-height:420px;object-fit:contain;background:#fff}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:1px}
.bands{display:flex;gap:6px;flex-wrap:wrap}
.bands button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 12px;font-family:var(--f-mono)}
.bands button[aria-pressed=true]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:min(980px,100%);max-height:88vh;overflow:auto}
.toggle-grid td,.toggle-grid th{text-align:center}
.sw-t{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--line)}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw-t[aria-checked=true]{background:var(--ok)}
.sw-t[aria-checked=true]::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mast);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.preview-banner{background:var(--warnbg);color:var(--warn);font-size:13px;text-align:center;padding:6px}
[data-read]{position:relative}
[data-read]:not(.brief)>*:nth-child(2){padding-right:104px}
.brief[data-read]{padding-right:112px}
.listen{position:absolute;top:12px;right:12px;z-index:1;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:bold}
.listen[aria-pressed=true]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.chip.lang select{background:transparent;border:0;color:var(--mastfg);padding:0;width:auto;font-size:12px}
.chip.lang select option{color:#16223A}
#gtHost,.goog-te-banner-frame,.skiptranslate>iframe,#goog-gt-tt,.goog-te-balloon-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:640px){.checks{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:14px;cursor:pointer}
.chk input{margin-top:3px}
.view-only>:not(.listen){pointer-events:none;user-select:none}
.view-only{opacity:.92}
footer{font-size:12px;color:var(--muted);text-align:center;padding-block:20px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-all}
ol.guide li{margin-bottom:8px}
</style>

        `<table><tr><th>Research question</th><th>Type</th><th>Method / source</th><th>Priority and reason</th></tr><tr><td>Which services and prices should the site show?</td><td>Primary</td><td>Interview with Layla</td><td>1 — the site cannot exist without this content</td></tr><tr><td>How do customers prefer to book?</td><td>Primary</td><td>Survey of 10 pet owners</td><td>2 — decides the booking feature</td></tr><tr><td>What do competitor sites offer?</td><td>Secondary</td><td>Two local groomer websites</td><td>3 — shows the minimum standard</td></tr><tr><td>What makes a site easy to use on a phone?</td><td>Secondary</td><td>Web design guidance articles</td><td>4 — most users are on phones</td></tr></table>`,
        `<table><tr><th>Website</th><th>Audience</th><th>Strengths</th><th>Weaknesses</th><th>Inspiration</th></tr><tr><td>A national pet-store chain's grooming page</td><td>Busy pet owners</td><td>Online booking, clear price list</td><td>Cluttered with product adverts</td><td>A clear price table and a booking button</td></tr><tr><td>An independent groomer's site</td><td>Local customers</td><td>Friendly photos of real pets</td><td>No prices; breaks on phones</td><td>Real photos; must be responsive</td></tr><tr><td>A hair-salon booking site</td><td>Salon customers</td><td>Calendar booking and reminders</td><td>Not designed for pets</td><td>A simple time-slot calendar</td></tr></table><p class="note">Comparison: the chain is easiest to book but impersonal; the independent site feels friendly but is hard to use. My design should combine both.</p>`,
        `<p><b>Design brief.</b> Client: Layla, Paws & Bubbles. Problem: missed bookings and hidden prices. Key findings: 7/10 owners prefer online booking; most use phones; competitors show prices and booking. Constraints: four lessons, a free website builder, Layla's own photos. Goal: a responsive four-page website with a clear price list and a booking request form.</p>`

      B: [
        `<table><tr><th>Area</th><th>Specification point</th><th>Linked to research</th><th>Test</th></tr><tr><td>Function</td><td>A "Book now" button on every page</td><td>7/10 prefer online booking</td><td>Check each page</td></tr><tr><td>Function</td><td>The booking form sends to Layla's email</td><td>Interview</td><td>Submit a test booking</td></tr><tr><td>Content</td><td>Full price list on the Services page</td><td>Competitor analysis</td><td>Compare with Layla's list</td></tr><tr><td>User</td><td>Works on a 375-pixel-wide phone screen</td><td>Most users are on phones</td><td>Test on a phone</td></tr><tr><td>Aesthetics</td><td>Uses the salon's teal and white colours</td><td>Interview</td><td>Colour check</td></tr><tr><td>Accessibility</td><td>Every image has alt text</td><td>Web guidance</td><td>Inspect each image</td></tr></table>`,

    "10": {
      A: [
        `<p><b>The problem:</b> the library lends about 40 laptops, cameras and graphing calculators using a paper sign-out sheet. Last term 6 items went missing (worth about AED 9,000), and Mrs. Khan spends around 30 minutes a day chasing late returns.</p><p><b>Client and stakeholders:</b> Mrs. Khan (librarian); students and teachers who borrow; the IT technician who maintains devices; the finance office that replaces losses.</p><p><b>Justification:</b> losses cost money, chasing wastes staff time, and students cannot see whether equipment is available. Paper records cannot show patterns such as which items are most often late, so a digital system with accurate, secure data is needed.</p>`,
        `<table><tr><th>Research question</th><th>Type</th><th>Method &amp; source</th><th>Priority</th><th>Justification</th></tr><tr><td>What data must be recorded for each loan?</td><td>Primary</td><td>Interview with Mrs. Khan</td><td>1</td><td>Defines the whole data structure</td></tr><tr><td>Who needs to see which data?</td><td>Primary</td><td>Interviews with stakeholders</td><td>2</td><td>Decides privacy and access</td></tr><tr><td>What loan rules apply?</td><td>Primary</td><td>Library policy document</td><td>3</td><td>Validation rules</td></tr><tr><td>How do existing loan systems work?</td><td>Secondary</td><td>Product websites, demos</td><td>4</td><td>Avoid reinventing features</td></tr><tr><td>What does data-protection law require for student data?</td><td>Secondary</td><td>UAE data-protection guidance</td><td>5</td><td>Legal constraint</td></tr></table><p class="note">Reflection: question 1 comes first because every later decision depends on the fields being right.</p>`,
        `<table><tr><th>System</th><th>Who uses it</th><th>Key features</th><th>Strengths</th><th>Limitations</th><th>Implication</th></tr><tr><td>A commercial library management system</td><td>Large libraries</td><td>Barcode scanning, overdue emails</td><td>Automated and reliable</td><td>Expensive; built for books</td><td>Include automatic overdue alerts</td></tr><tr><td>A spreadsheet loan template</td><td>Small teams</td><td>Simple table and filters</td><td>Free and easy to edit</td><td>No validation; easy to overwrite</td><td>Add an input form with validation</td></tr><tr><td>Self-checkout in a supermarket</td><td>Shoppers</td><td>Scan, confirm, receipt</td><td>Very fast</td><td>Needs dedicated hardware</td><td>Use QR codes scanned by phone</td></tr></table><p>Analysis: the strongest systems separate data entry from data storage and use automation for reminders. Free tools lack validation, which causes the errors seen on the paper sheet.</p>`,
        `<p><b>Detailed design brief.</b> Context: a secondary-school library lending 40 high-value items. Analysis: losses come from missing return dates and unreadable handwriting; stakeholders need different views; automated reminders reduce chasing. Constraints: free school software only, built in 5 lessons, student data visible only to library staff. Goal: a data system with a validated loan form, linked Items/Borrowers/Loans tables and a dashboard of current and overdue loans.</p>`

        `<p><b>Idea 1:</b> an online form feeding a spreadsheet, with a chart dashboard. <b>Idea 2:</b> a relational database with separate forms and a report view. <b>Idea 3:</b> QR stickers on every item; scanning opens a pre-filled form linked to a dashboard. Each concept is annotated with data flow, users and tools.</p>`,
        `<table><tr><th>Criterion</th><th>Weight</th><th>Idea 1</th><th>Idea 2</th><th>Idea 3</th></tr><tr><td>Validation</td><td>3</td><td>2</td><td>5</td><td>4</td></tr><tr><td>Speed of loan</td><td>3</td><td>3</td><td>3</td><td>5</td></tr><tr><td>Privacy</td><td>2</td><td>3</td><td>5</td><td>4</td></tr><tr><td>Feasibility</td><td>2</td><td>5</td><td>3</td><td>4</td></tr><tr><td><b>Total</b></td><td></td><td>31</td><td>40</td><td><b>45</b></td></tr></table><p>I chose <b>Idea 3</b>. It scores highest on the weighted matrix, mainly because QR scanning meets the 30-second target and removes typing errors. I will add Idea 2's linked-table structure to improve validation.</p>`,

Object.assign(COURSE.examples["10"], {
  C: [
    `<table><tr><th>Stage</th><th>Task</th><th>Resources</th><th>Time</th><th>Dependency</th><th>Contingency</th></tr><tr><td>1</td><td>Create Items, Borrowers, Loans sheets with headers</td><td>Google Sheets</td><td>L1</td><td>—</td><td>Use a template if time runs short</td></tr><tr><td>2</td><td>Add validation rules and data types</td><td>Sheets data validation</td><td>L1</td><td>1</td><td>Test each rule as it is added</td></tr><tr><td>3</td><td>Build the loan form</td><td>Google Forms</td><td>L2</td><td>1</td><td>—</td></tr><tr><td>4</td><td>Generate QR codes with pre-filled item IDs</td><td>QR generator</td><td>L2</td><td>3</td><td>Printed ID list as backup</td></tr><tr><td>5</td><td>Lookup formulas linking loans to items and borrowers</td><td>XLOOKUP</td><td>L3</td><td>1–3</td><td>Ask a peer to check formulas</td></tr><tr><td>6</td><td>Dashboard: current, overdue, chart</td><td>Charts, conditional formatting</td><td>L4</td><td>5</td><td>—</td></tr><tr><td>7</td><td>Protect personal data ranges</td><td>Protected ranges</td><td>L4</td><td>1</td><td>—</td></tr><tr><td>8</td><td>Test with 10 records and fix</td><td>Test plan</td><td>L5</td><td>All</td><td>Extra lunchtime session</td></tr></table><p class="note">Efficiency: the structure is built before any form or dashboard, so nothing has to be rebuilt.</p>`,
    `<p>I used data validation (item IDs must exist in Items; dates must be dates), XLOOKUP to pull item and borrower details into each loan, a formula for the due date (=LoanDate+7), conditional formatting to turn overdue rows red, a pivot chart for loans by item type, and protected ranges so only staff can see borrower emails. I chose XLOOKUP over VLOOKUP because it still works if columns are moved.</p>`,
    `<p><b>Finished system:</b> scanning an item's QR code opens a pre-filled form; the loan appears in the Loans sheet with its due date; the dashboard shows current loans, overdue items in red and a chart by type. It functions as intended with 10 test records. It is presented appropriately: the dashboard fits one laptop screen and is the first tab Mrs. Khan sees, and staff-only tabs are hidden from student view.</p>`,
    `<table><tr><th>Change</th><th>Justification (evidence)</th><th>Impact on specification</th></tr><tr><td>Overdue emails replaced by a red-highlight list Mrs. Khan checks daily</td><td>The school account blocks scripts that send email automatically</td><td>The "overdue alert" point is still met, but manually</td></tr><tr><td>Added a "Condition on return" field</td><td>The IT technician asked to track damage</td><td>New point added: damage is recorded</td></tr><tr><td>Testing took 2 lessons, not 1</td><td>The validation rule failed with mixed-case IDs</td><td>Fixed with UPPER(), improving data accuracy</td></tr></table>`
  ],
  D: [
    `<table><tr><th>Specification point</th><th>Test method</th><th>Sample</th><th>Data</th></tr><tr><td>Loan recorded in under 30 s</td><td>Timed loans, scanning to submit</td><td>5 students × 3 loans</td><td>Seconds</td></tr><tr><td>Invalid item ID rejected</td><td>Enter 5 invalid and 5 valid IDs</td><td>Me and the technician</td><td>Accepted/rejected</td></tr><tr><td>Due date correct</td><td>Compare 10 records with a manual calculation</td><td>10 records</td><td>Number correct</td></tr><tr><td>Overdue items red</td><td>Create 3 overdue test records</td><td>3 records</td><td>Highlighted yes/no</td></tr><tr><td>Students cannot see borrower data</td><td>Log in with a student account</td><td>2 student accounts</td><td>Access yes/no</td></tr><tr><td>Dashboard totals accurate</td><td>Compare with a manual count</td><td>2 different days</td><td>Difference</td></tr></table><p class="note">Reliability: each timed test is repeated three times with real borrowers, not friends, and recorded on the same sheet.</p>`,

/* ---------------- WORKED EXAMPLES — GRADE 7 (Switch Off Standby campaign) ---------------- */
COURSE.examples["7"] = {
  A: [
    `<p><b>The problem:</b> in many homes, TVs, consoles and chargers are left on standby all day and night. They waste electricity even when nobody is using them.</p><p><b>Target audience:</b> families with many devices at home, reached through students.</p><p><b>Why it matters:</b> standby power can make up a noticeable part of a home's electricity bill, and in the UAE most electricity still comes from burning gas. Families often don't know it happens, so an awareness campaign could change habits quickly and cheaply.</p>`,
    `<table><tr><th>Research question</th><th>Primary / secondary</th><th>How</th><th>Priority</th></tr><tr><td>How many devices do our families leave on standby?</td><td>Primary</td><td>Survey of 20 students</td><td>1</td></tr><tr><td>How much energy does standby waste?</td><td>Secondary</td><td>Energy-agency websites</td><td>2</td></tr><tr><td>What kind of message makes teenagers act?</td><td>Primary</td><td>Show 3 sample posters to classmates</td><td>3</td></tr><tr><td>What have other energy campaigns done?</td><td>Secondary</td><td>Look at real campaigns online</td><td>4</td></tr></table><p class="note">The survey comes first because it proves the problem exists in our own community.</p>`,
    `<table><tr><th>Existing campaign</th><th>Strengths</th><th>Weaknesses</th><th>Idea I can use</th></tr><tr><td>Earth Hour</td><td>Simple action, global reach</td><td>Only one hour a year</td><td>A simple, clear action</td></tr><tr><td>A local electricity provider's saving tips</td><td>Real local numbers</td><td>Lots of small text</td><td>Use local facts, but in big visuals</td></tr><tr><td>A school "switch off" sticker campaign</td><td>A reminder where the action happens</td><td>Plain design</td><td>Put stickers or QR codes near plugs</td></tr></table>`,
    `<p><b>Findings:</b> 17 of 20 students said their family leaves at least 3 devices on standby overnight; standby is a hidden cost families don't notice; classmates preferred short messages with one bold image and a clear action.</p><p><b>Design brief:</b> I am going to design a digital campaign for families with many devices, because standby wastes electricity without them noticing. It will include a poster, an infographic and a 45-second video with one clear action: switch off at the wall.</p>`
  ],
  B: [
    `<table><tr><th>Area</th><th>Success criterion</th><th>Test</th></tr><tr><td>Message</td><td>The main action can be understood in 5 seconds</td><td>Time 5 classmates</td></tr><tr><td>Facts</td><td>At least 3 facts, each with a source</td><td>Count the facts and sources</td></tr><tr><td>Look</td><td>Same 3 colours and 2 fonts on all pieces</td><td>Check each piece</td></tr><tr><td>Video</td><td>30–60 seconds, with captions</td><td>Time it and check the captions</td></tr><tr><td>Audience</td><td>Families say they would switch off after seeing it</td><td>Ask 5 families</td></tr><tr><td>Action</td><td>A clear call to action on every piece</td><td>Checklist</td></tr></table>`,
    `<p><b>Idea 1:</b> a "Vampire Devices" theme — cartoon chargers draining energy at night. <b>Idea 2:</b> a money theme — "Your TV costs you money while you sleep." <b>Idea 3:</b> a planet theme — a melting globe plugged into a socket. Each poster sketch is labelled with headline, image, facts and call to action.</p>`,
    `<p>I chose <b>Idea 1</b> because it meets all 6 criteria. Classmates remembered the "vampire" message best (4 of 5), and it works for both children and parents. Idea 3 was less clear about the action, and Idea 2 did not appeal to students.</p>`,
    `<p><b>Poster layout:</b> headline at the top "Stop the Energy Vampires!", the cartoon charger in the centre, 3 facts with icons below, and the call to action "Switch off at the wall" in a red banner.</p><p><b>Video storyboard (6 frames, 45 s):</b> dark room → glowing devices → vampire appears → fact on screen → a student switches off → logo and call to action.</p><p><b>Requirements:</b> Canva, copyright-free images, my own voice-over, 4 lessons.</p>`
  ],
  C: [
    `<table><tr><th>Step</th><th>What I will do</th><th>Resources</th><th>Time</th></tr><tr><td>1</td><td>Set up a brand kit (3 colours, 2 fonts, logo)</td><td>Canva</td><td>Lesson 1</td></tr><tr><td>2</td><td>Make the poster</td><td>Canva, cartoon images</td><td>Lesson 1</td></tr><tr><td>3</td><td>Make the infographic with sourced facts</td><td>Canva charts, my research</td><td>Lesson 2</td></tr><tr><td>4</td><td>Film and edit the video</td><td>Phone camera, Canva video</td><td>Lesson 3</td></tr><tr><td>5</td><td>Add captions and export all pieces</td><td>Canva</td><td>Lesson 4</td></tr><tr><td>6</td><td>Test with 5 classmates and fix</td><td>Testers</td><td>Lesson 4</td></tr></table>`,
    `<p>I created a brand kit so every piece uses the same navy, yellow and white, with one headline font. On the poster I used size and colour to make the headline the first thing you see. I turned my survey data into a bar chart on the infographic, cut the video to 45 seconds with transitions on the beat, and added captions so it works without sound.</p>`,
    `<p><b>Finished campaign:</b> an A3 poster, a portrait infographic for the school screens and a 45-second captioned video. It works as intended: classmates explained the action within 5 seconds, and all three pieces share one look.</p>`,
    `<table><tr><th>Change</th><th>Why</th><th>Effect</th></tr><tr><td>Cut the video from 70 s to 45 s</td><td>Testers lost interest after 40 s</td><td>Keeps attention</td></tr><tr><td>Added a QR code linking to energy tips</td><td>A parent asked where to learn more</td><td>Gives a next step</td></tr><tr><td>Changed the red banner to yellow</td><td>Red text on navy was hard to read</td><td>Better contrast</td></tr></table>`
  ],
  D: [

    `<table><tr><th>Specification point</th><th>Result / data</th><th>Met?</th></tr><tr><td>Understood in 5 s</td><td>5/5 correct, average 3 s</td><td>Yes</td></tr><tr><td>Sourced facts</td><td>3 facts, 3 sources</td><td>Yes</td></tr><tr><td>Consistent look</td><td>3/3 match</td><td>Yes</td></tr><tr><td>Video</td><td>45 s, captioned</td><td>Yes</td></tr><tr><td>Families would act</td><td>4 of 5 families</td><td>Mostly</td></tr></table><p>The campaign is successful: four points were fully met. One family said they already switch off, so the message did not change their behaviour, but they still found it clear.</p>`,
    `<table><tr><th>Weakness</th><th>Improvement</th><th>How I would do it</th></tr><tr><td>No proof that families actually changed</td><td>Do a one-week follow-up survey</td><td>Ask the same families again</td></tr><tr><td>English only</td><td>Arabic and French versions</td><td>Translate the text, keep the design</td></tr><tr><td>The poster is only on one wall</td><td>Stickers beside classroom plugs</td><td>Print small "vampire" stickers</td></tr></table>`,
    `<p>Families who saw the campaign now know that standby wastes energy, and 4 of 5 said they would switch off at the wall. If even half the school's families do this, it could save a noticeable amount of electricity each year and reduce emissions from power stations (SDG 13). Students also became messengers at home, which spreads the habit further.</p><p class="note">A parent said: "My son now goes around switching everything off at night!"</p>`

/* ---------------- WORKED EXAMPLES — GRADE 10 IT (Community Library Network) ---------------- */
COURSE.examples["10IT"] = {
  A: [
    `<p><b>The problem:</b> the community library runs 12 public computers, 4 staff computers and free visitor Wi-Fi on one flat network. Last month a visitor's infected laptop spread malware to two staff computers, and the catalogue was offline for a day.</p><p><b>Client and stakeholders:</b> Mr. Faris (manager); librarians who handle members' personal data; public-computer users; Wi-Fi visitors; the city council that funds the library.</p><p><b>Justification:</b> one flat network lets any device reach any other, so a single infected device can compromise members' personal data. The outage cost a day of service, and a data breach could bring legal penalties and loss of public trust. Segmentation and staff awareness would remove the main risk at low cost.</p>`,
    `<table><tr><th>Research question</th><th>Type</th><th>Method &amp; source</th><th>Priority</th><th>Justification</th></tr><tr><td>Which devices and services does the library use?</td><td>Primary</td><td>Site visit and device audit</td><td>1</td><td>Defines everything to be protected</td></tr><tr><td>What data is stored and who can access it?</td><td>Primary</td><td>Interview with Mr. Faris</td><td>2</td><td>Decides security priorities</td></tr><tr><td>What threats target small public organisations?</td><td>Secondary</td><td>National cybersecurity guidance</td><td>3</td><td>Focuses the controls</td></tr><tr><td>How do other libraries separate public and staff networks?</td><td>Secondary</td><td>Case studies, vendor guides</td><td>4</td><td>Proven designs</td></tr><tr><td>What does UAE data-protection law require?</td><td>Secondary</td><td>Official guidance</td><td>5</td><td>Legal constraint</td></tr></table><p class="note">The device audit comes first: you cannot secure what you have not identified.</p>`,
    `<table><tr><th>Product / system</th><th>Users</th><th>Key features</th><th>Strengths</th><th>Limitations</th><th>Implication</th></tr><tr><td>A consumer router with guest Wi-Fi</td><td>Homes</td><td>Separate guest network</td><td>Cheap and simple</td><td>Limited control and logging</td><td>Guest separation is essential, but needs business features</td></tr><tr><td>A small-business firewall with VLANs</td><td>Offices</td><td>Segments, rules, logs</td><td>Strong control</td><td>Needs configuration skill</td><td>Use VLANs for staff, public PCs and guests</td></tr><tr><td>A cloud-managed Wi-Fi system</td><td>Schools, cafés</td><td>Captive portal, remote management</td><td>Easy to monitor</td><td>Subscription cost</td><td>Add a portal with acceptable-use terms</td></tr></table><p>Analysis: every successful design separates untrusted users from staff systems and keeps logs; the main trade-off is between cost and control.</p>`,
    `<p><b>Detailed design brief.</b> Context: a public library with mixed trusted and untrusted users. Analysis: the main risk is lateral movement on a flat network; staff passwords are reused; there are no tested back-ups. Constraints: a budget for one business router or firewall, no full-time IT staff, member data must stay private. Goal: a segmented network (staff, public PCs, guest Wi-Fi), hardened devices, a back-up plan and a one-page staff security guide.</p>`
  ],
  B: [
    `<table><tr><th>Area</th><th>Specification point</th><th>Justification</th><th>Measurable test</th></tr><tr><td>Segmentation</td><td>Three separate networks: staff, public PCs, guests</td><td>Malware incident</td><td>A guest device cannot reach a staff PC</td></tr><tr><td>Wi-Fi</td><td>WPA3 (or WPA2) encryption; guest portal with terms</td><td>Best practice</td><td>Check the settings</td></tr><tr><td>Access</td><td>Unique staff accounts with MFA for the catalogue</td><td>Password reuse</td><td>Log in test</td></tr><tr><td>Back-up</td><td>Daily automatic back-up, one copy offsite</td><td>Outage</td><td>Restore one file</td></tr><tr><td>Performance</td><td>Each public PC at least 20 Mbps</td><td>User needs</td><td>Speed test on 3 PCs</td></tr><tr><td>Training</td><td>Staff guide readable in under 5 minutes</td><td>No IT staff</td><td>Time 3 staff</td></tr></table>`,
    `<p><b>Idea 1:</b> a business router with three VLANs and guest Wi-Fi. <b>Idea 2:</b> separate physical switches and two internet connections. <b>Idea 3:</b> cloud-managed Wi-Fi and a firewall with a captive portal. Each topology sketch labels devices, segments and security controls.</p>`,
    `<table><tr><th>Criterion</th><th>Weight</th><th>Idea 1</th><th>Idea 2</th><th>Idea 3</th></tr><tr><td>Security</td><td>3</td><td>4</td><td>5</td><td>5</td></tr><tr><td>Cost</td><td>3</td><td>5</td><td>2</td><td>3</td></tr><tr><td>Ease of management</td><td>2</td><td>3</td><td>2</td><td>5</td></tr><tr><td>Scalability</td><td>2</td><td>4</td><td>2</td><td>4</td></tr><tr><td><b>Total</b></td><td></td><td><b>41</b></td><td>29</td><td>40</td></tr></table><p>I chose <b>Idea 1</b>: it scores highest because it gives proper segmentation within the budget. I will add Idea 3's guest portal, which the chosen router supports.</p>`,
    `<p><b>Diagram:</b> ISP modem → firewall router → managed switch with VLAN 10 Staff (192.168.10.0/24), VLAN 20 Public PCs (192.168.20.0/24), VLAN 30 Guest Wi-Fi (192.168.30.0/24, internet only). Firewall rules: deny VLAN 20/30 → VLAN 10.</p><p><b>Requirements:</b> a business router with VLAN support, a managed 24-port switch, 2 access points, a NAS for back-ups, draw.io, Packet Tracer for testing, 5 lessons.</p>`
  ],
  C: [
    `<table><tr><th>Stage</th><th>Task</th><th>Resources</th><th>Time</th><th>Dependency</th><th>Contingency</th></tr><tr><td>1</td><td>Draw the final topology</td><td>draw.io</td><td>L1</td><td>—</td><td>—</td></tr><tr><td>2</td><td>Write the addressing and VLAN table</td><td>Docs</td><td>L1</td><td>1</td><td>—</td></tr><tr><td>3</td><td>Build the network in Packet Tracer</td><td>Packet Tracer</td><td>L2</td><td>1, 2</td><td>Use a simpler model if devices are missing</td></tr><tr><td>4</td><td>Configure VLANs, DHCP and firewall rules</td><td>Packet Tracer</td><td>L3</td><td>3</td><td>Use teacher checkpoints</td></tr><tr><td>5</td><td>Write the security policy and back-up plan</td><td>Docs</td><td>L4</td><td>2</td><td>—</td></tr><tr><td>6</td><td>Design the staff guide</td><td>Canva</td><td>L4</td><td>5</td><td>—</td></tr><tr><td>7</td><td>Test connectivity and isolation, then fix</td><td>Ping, test log</td><td>L5</td><td>4</td><td>Extra lunchtime session</td></tr></table><p class="note">Efficiency: addressing is planned once before any configuration, so devices don't have to be re-addressed later.</p>`,
    `<p>I used standard Cisco icons and colour-coded each VLAN in draw.io. In Packet Tracer I created VLANs 10, 20 and 30 on the switch, set trunk ports to the router, configured DHCP pools for each subnet, and added access-control rules that block traffic from Public and Guest to Staff. I set WPA2-PSK on the access points with a 16-character passphrase. In Canva I wrote the guide in plain language with icons.</p>`,
    `<p><b>Finished solution:</b> a labelled diagram, a working Packet Tracer simulation, a security policy and a one-page staff guide. It functions as intended: devices get the correct addresses, guests reach the internet, and a guest cannot ping a staff PC. It is presented appropriately: Mr. Faris receives a one-page summary first, with the technical detail in an appendix for an IT contractor.</p>`,
    `<table><tr><th>Change</th><th>Justification (evidence)</th><th>Impact on specification</th></tr><tr><td>WPA2 instead of WPA3 on the access points</td><td>The Packet Tracer access points don't support WPA3; the real devices do</td><td>Encryption point met in the simulation; WPA3 recommended in the policy</td></tr><tr><td>Added a separate printer VLAN</td><td>Testing showed public PCs could print to the staff printer</td><td>Segmentation strengthened</td></tr><tr><td>Guide cut from 2 pages to 1</td><td>A staff tester took 9 minutes to read 2 pages</td><td>The 5-minute training point can now be met</td></tr></table>`
  ],

<script>
(function(){

/* ================= UTILITIES ================= */
const $ = (s, r=document) => r.querySelector(s);

const ROMAN = ["i","ii","iii","iv"];
const LS_KEY = "sisdDesignStudio.v1";
const words = s => (String(s||"").trim().match(/\S+/g) || []).length;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const stripTags = s => String(s).replace(/<[^>]+>/g, "");

function load(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } }
let DB = load();
DB.users = DB.users || {}; DB.queue = DB.queue || []; if (DB.voice === undefined) DB.voice = true;
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch(e){ toast("Storage is full or blocked on this device — download your PDF to keep a copy."); } }

function toast(msg, ms=3200){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

/* settings: baked CONFIG, overridden on the teacher's own device */
function settings(){ return Object.assign({}, CONFIG, DB.teacherSettings || {}); }

/* ================= SPEECH ================= */
function speak(text, opts={}){
  if (!DB.voice && !opts.force) return null;
  try {
    if (!("speechSynthesis" in window)) return null;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = opts.rate || 1; u.lang = LANGS[lang()].voice; const v = voiceFor(lang()); if (v) u.voice = v;
    if (!opts.queue) speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return u;
  } catch(e){ return null; }
}
/* ================= LANGUAGE & READ-ALOUD ================= */
const LANGS = {
  en: { label: "English", voice: "en-GB" },
  fr: { label: "Français", voice: "fr-FR" },
  ru: { label: "Русский", voice: "ru-RU" },

    return vs.find(v => v.lang.replace("_","-") === want) || vs.find(v => v.lang.toLowerCase().startsWith(code)) || null; } catch(e){ return null; }

function chunks(text){
  const parts = String(text).replace(/\s+/g, " ").trim().match(/[^.!?;:。]+[.!?;:。]*\s*/g) || [];
  const out = []; let cur = "";
  parts.forEach(p => { if ((cur + p).length > 220 && cur){ out.push(cur); cur = ""; } cur += p; });
  if (cur.trim()) out.push(cur); return out;
}

function speakLong(text, opts={}){
  try { if (!("speechSynthesis" in window)) { opts.onend && opts.onend(); return false; } } catch(e){ return false; }
  const my = ++readToken; try { speechSynthesis.cancel(); } catch(e){}
  const code = lang(), v = voiceFor(code), list = chunks(text);
  let i = 0;

    if (my !== readToken) return;
    if (i >= list.length){ opts.onend && opts.onend(); return; }
    const u = new SpeechSynthesisUtterance(list[i++]); u.lang = LANGS[code].voice; if (v) u.voice = v; u.rate = opts.rate || 0.97;
    let done = false; const fin = () => { if (!done){ done = true; next(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, Math.max(6000, u.text.length * 110));
    speechSynthesis.speak(u);

}

const b64e = u8 => btoa(String.fromCharCode(...u8));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function hashPw(pw, saltB64){
  if (!(window.crypto && crypto.subtle)) throw new Error("Open the course from its https:// link to sign in.");
  const salt = saltB64 ? b64d(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:100000, hash:"SHA-256" }, key, 256);
  return { salt: b64e(salt), hash: b64e(new Uint8Array(bits)) };
}
async function checkPw(pw, rec){ if (!rec || !rec.salt) return false; return (await hashPw(pw, rec.salt)).hash === rec.hash; }
function pwProblem(pw){ if (pw.length < 8) return "Your password must be at least 8 characters."; if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return "Your password must include at least one letter and one number."; return ""; }

function parseFormLink(link){
  if (!link) return null;
  const m = link.match(/docs\.google\.com\/forms\/(?:u\/\d+\/)?d\/(e\/)?([^/]+)\//);
  if (!m) return null;
  const action = `https://docs.google.com/forms/d/${m[1]||""}${m[2]}/formResponse`;
  const entries = []; const re = /entry\.(\d+)=/g; let x; while ((x = re.exec(link))) entries.push("entry."+x[1]);
  return entries.length ? { action, entries } : null;
}
async function postForm(link, values){
  const f = parseFormLink(link); if (!f) return false;
  const p = new URLSearchParams();
  f.entries.forEach((e,i) => {
    let v = values[i] ?? "";
    if (i === f.entries.length-1 && values.length > f.entries.length) v = values.slice(i).join(" | ");
    p.append(e, v);
  });
  try { await fetch(f.action, { method:"POST", mode:"no-cors", body:p }); return true; } catch(e){ return false; }
}

async function flushQueue(){
  const link = settings().logForm; if (!link || flushing || !DB.queue.length) return;

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function loadLive(){
  const url = settings().controlCsv; if (!url) return;
  try {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "cb=" + Date.now());
    if (!r.ok) return;
    const rows = parseCSV(await r.text()); let state = null; const reqs = [];
    for (let i=1;i<rows.length;i++){
      const cell = rows[i].slice(1).find(v => v && v.trim().startsWith("{")); if (!cell) continue;
      try { const d = JSON.parse(cell); if (d.unlocks) state = d; else if (d.request) reqs.push(d.request); } catch(e){}
    }
    REQUESTS = reqs;
    if (state){ const next = { unlocks: state.unlocks, teachers: state.teachers || [], declined: state.declined || [] };
      const changed = JSON.stringify(LIVE) !== JSON.stringify(next); LIVE = next; if (changed && !$("#modalRoot .modal")) render(); }
  } catch(e){ /* offline: keep the baked settings */ }
}
async function publishState(next){
  const s = settings(); DB.localState = next; save(); if (s.controlCsv) LIVE = next;
  if (!s.controlForm) return "local";
  return (await postForm(s.controlForm, [JSON.stringify(Object.assign({}, next, { t:new Date().toISOString() }))])) ? "sent" : "failed";
}

        if (!pw) return msg("Enter your password.");

          else return msg("No account on this device for that email. Choose <b>Sign up</b> if this is your first time here.");

          if (!(await checkPw(pw, u))) return msg("That password is not right. If you have forgotten it, ask your teacher to reset it on this device.");

            const t = approvedTeacher(email);

          }

      const prob = pwProblem(pw); if (prob) return msg(prob);
      if (pw !== $("#lPw2").value) return msg("The two passwords do not match.");
      const rec = await hashPw(pw);
      if (role === "teacher"){
        const req = { email, name, salt:rec.salt, hash:rec.hash, t:new Date().toISOString() };
        DB.users[email] = { role:"teacher", name, salt:rec.salt, hash:rec.hash, created:req.t };

        const s = settings(); if (s.controlForm) postForm(s.controlForm, [JSON.stringify({ request:req })]);
        DB.queue.push([email, name, "Staff", "-", "-", "Teacher access requested", "Teacher", "Waiting for admin approval", req.t]); save(); flushQueue();
        setMode("in"); $("#lEmail").value = email;

      DB.users[email] = { role:"student", name, grade, teacher, salt:rec.salt, hash:rec.hash, created:new Date().toISOString(), progress:{} };
      session.email = email; DB.session = email; save();
      logEvent("-", "Signed up", gradeData(grade).choose ? "Choosing their focus" : `Design challenge: ${scenarioFor(email, grade).title}`);
      speak(P().welcome(name.split(" ")[0]));
      go({ name:"home" });
    } catch(err){ msg(esc(err.message)); }
    finally { const b = $("#lGo"); if (b) b.disabled = false; }
  };
}

/* ================= CRITERION FLOW ================= */
const STEPS = [
  { k:"video", t:"Introduction", s:"Watch the video" },
  { k:"ex",    t:"Worked example", s:"A different problem" },
  { k:"me",    t:"How to solve it", s:"Method & starters" },
  { k:"ru",    t:"Rubric", s:"How you're marked" },
  { k:"prac",  t:"Practice", s:"Pass before the task" },
  { k:"task",  t:"Your task", s:"Strands i–iv" },
  { k:"sub",   t:"Download & hand in", s:"PDF + teacher copy" }
];
function stepDone(p, i){
  switch(STEPS[i].k){ case "video": return p.watched; case "ex": return !!p.seen.ex; case "me": return !!p.seen.me; case "ru": return !!p.seen.ru;
    case "prac": return p.ex.done; case "task": return p.done.every(Boolean); case "sub": return p.finished; }
}
function stepUnlocked(p, i){ for (let j=0;j<i;j++) if (!stepDone(p,j)) return false; return true; }
function firstStep(c){ const p = prog(user(), c); for (let i=0;i<STEPS.length;i++) if (!stepDone(p,i)) return i; return STEPS.length-1; }

function renderCrit(app){
  const u = user(), c = view.crit, g = u.grade, gd = gradeData(g), cd = COURSE.criteria[c], p = prog(u,c), sc = scenarioFor(session.email, g);
  if (!isOpen(g,c) || !sc) return go({ name:"home" });
  if (!stepUnlocked(p, view.step)) view.step = firstStep(c);
  app.innerHTML = `<div class="stack">
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost sm" id="back">← All criteria</button>
      <div class="muted" style="font-size:13px">${esc(gLabel(g))} · MYP ${gd.myp} · ${esc(sc.title)}</div>
    </div>
    <div><div class="eyebrow">Criterion ${c}</div><h1 style="font-family:var(--f-display);font-size:clamp(22px,3.2vw,30px)">${esc(cd.name)}</h1></div>
    <nav class="steps" aria-label="Steps">${STEPS.map((s,i)=>`<button class="step ${stepDone(p,i)?"done":""}" data-i="${i}" ${stepUnlocked(p,i)?"":"disabled"} aria-current="${view.step===i}"><span class="n">${i+1} / ${STEPS.length}</span><b>${s.t}</b><span class="muted">${s.s}</span></button>`).join("")}</nav>
    <section class="pane" id="pane"></section></div>`;
  $("#back").onclick = () => go({ name:"home" });
  app.querySelectorAll(".step").forEach(b => b.onclick = () => { if (!b.disabled){ view.step = +b.dataset.i; stopVideo(); try{speechSynthesis.cancel()}catch(e){} render(); } });
  const pane = $("#pane");
  setTimeout(() => {
    if (view.step === 0 || $("#backStep")) return;
    const bar = document.createElement("div"); bar.className = "row"; bar.style.marginTop = "16px";
    bar.innerHTML = `<button class="btn ghost" id="backStep">← Back to ${esc(STEPS[view.step-1].t)}</button>`;
    pane.appendChild(bar);
    $("#backStep").onclick = () => { stopVideo(); stopReading(); view.step -= 1; render(); window.scrollTo({top:0, behavior:"smooth"}); };
  }, 0);
  ({ video:paneVideo, ex:paneExample, me:paneMethod, ru:paneRubric, prac:panePractice, task:paneTask, sub:paneSubmit })[STEPS[view.step].k](pane, { u, c, g, gd, cd, p, sc });
}
function nextBtn(label, onClick){ return `<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="nextStep">${label} →</button></div>`; }
function advance(ctx, key){ if (key) ctx.p.seen[key] = true; save(); view.step = Math.min(view.step+1, STEPS.length-1); render(); window.scrollTo({top:0, behavior:"smooth"}); }

  };
  const playScene = () => {
    if (!vid || !vid.playing) return;
    show();
    const s = scenes[vid.i], done = () => { if (!vid || !vid.playing) return; if (vid.i < scenes.length-1){ vid.i++; playScene(); } else { vid.playing = false; vid.ended = true; $("#vPlay").textContent = "↺ Replay"; } };
    const ms = Math.max(4000, words(s.say) / 2.6 * 1000);
    if (lang() !== "en"){ const me = vid; vid.timer = setTimeout(() => { if (vid !== me || !vid.playing) return; const st = $("#stage .txt"); speakLong(st ? st.innerText : s.say, { onend: () => { if (vid === me) vid.timer = setTimeout(done, 700); } }); }, 1600); return; }
    const u = speak(s.say, { force:true, rate:.98 });
    if (u){ let fired = false; u.onend = () => { if (!fired){ fired = true; clearTimeout(vid?.timer); vid && (vid.timer = setTimeout(done, 700)); } }; vid.timer = setTimeout(()=>{ if(!fired){ fired = true; done(); } }, ms + 6000); }
    else vid.timer = setTimeout(done, ms);
  };

    if (vid.playing){ vid.playing = false; clearTimeout(vid.timer); stopReading(); $("#vPlay").textContent = "▶ Play"; return; }

  };

  $("#vNext").onclick = () => { clearTimeout(vid.timer); stopReading(); vid.i = Math.min(scenes.length-1, vid.i+1); vid.playing ? playScene() : show(); };

/* ---------- 5. PRACTICE ---------- */
const NEED = 6;
function panePractice(pane, ctx){
  const { c, g, gd, p } = ctx;
  const pool = COURSE.exercises[c].filter(q => q.y <= gd.myp).concat(COURSE.gradeExercises[g][c]);
  if (!p.ex.queue || p.ex.queue.length === 0) p.ex.queue = shuffle(pool.map((_,i)=>i));
  const render_ = () => {
    if (p.ex.done && !p.ex.extra){
      pane.innerHTML = `<div class="card stack"><div class="notice ok">Practice passed — ${p.ex.correct} correct, ${p.ex.points} points. Your task is now open.</div>
        <p class="muted" style="margin:0">You can keep practising for more points, or move on.</p>
        <div class="row"><button class="btn sec" id="more">Keep practising</button><button class="btn" id="nextStep">Go to my task →</button></div></div>`;
      $("#more").onclick = () => { p.ex.extra = true; save(); ask(); };
      $("#nextStep").onclick = () => { p.ex.extra = false; save(); advance(ctx); };
      return;
    }
    ask();
  };
  const ask = () => {
    if (!p.ex.queue.length) p.ex.queue = shuffle(pool.map((_,i)=>i));
    const q = pool[p.ex.queue[0]]; let hinted = false, answered = false;
    const dots = Array.from({length:NEED},(_,i)=>`<i class="${i<Math.min(p.ex.correct,NEED)?"on":""}"></i>`).join("");
    pane.innerHTML = `<div class="card stack" data-read>
      <div class="row" style="justify-content:space-between"><div class="dots" aria-label="${p.ex.correct} of ${NEED} correct">${dots}</div><span class="counter">${p.ex.correct} / ${NEED} correct · ${p.ex.points} pts</span></div>
      <div class="eyebrow">${q.type==="mcq"?"Choose one":q.type==="order"?"Put in order":"Sort each item"}</div>
      <div class="q">${esc(q.q)}</div><div id="qBody"></div>
      <div id="qFb"></div>
      <div class="row"><button class="btn sec" id="hint">Hint (−5 pts)</button>${p.ex.done?`<button class="btn ghost" id="toTask">Go to my task →</button>`:""}<span class="sp" style="flex:1"></span><button class="btn" id="check">Check answer</button></div>
      <p class="muted" style="margin:0;font-size:12.5px">+10 points for each correct answer. Get ${NEED} right to unlock your task. Wrong answers come back later in a different order.</p></div>`;
    const body = $("#qBody"); let pick = null, order = null, cls = {};
    if (q.type === "mcq"){
      const idx = shuffle(q.o.map((_,i)=>i));
      body.innerHTML = `<div class="opts">${idx.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join("")}</div>`;
      body.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (answered) return; pick = +b.dataset.i; body.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel", o===b)); });
    } else if (q.type === "order"){
      order = shuffle(q.items); if (order.join() === q.items.join()) order.reverse();
      const draw = () => { body.innerHTML = `<div class="ord"><ol>${order.map((t,i)=>`<li><span class="counter">${i+1}</span><span>${esc(t)}</span><button class="btn sm sec" data-u="${i}" aria-label="Move up" ${i===0?"disabled":""}>↑</button><button class="btn sm sec" data-d="${i}" aria-label="Move down" ${i===order.length-1?"disabled":""}>↓</button></li>`).join("")}</ol></div>`;
        body.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{ if(answered)return; const i=+b.dataset.u; [order[i-1],order[i]]=[order[i],order[i-1]]; draw(); });
        body.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ if(answered)return; const i=+b.dataset.d; [order[i+1],order[i]]=[order[i],order[i+1]]; draw(); }); };
      draw();
    } else {
      const items = shuffle(q.items.map((it,i)=>i));
      body.innerHTML = `<div class="stack" style="gap:8px">${items.map(i=>`<div class="cls-row"><span>${esc(q.items[i][0])}</span><div class="seg" data-i="${i}">${q.cats.map((ct,k)=>`<button data-k="${k}" aria-pressed="false">${esc(ct)}</button>`).join("")}</div></div>`).join("")}</div>`;
      body.querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.onclick = () => { if (answered) return; cls[sg.dataset.i] = +b.dataset.k; sg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); }));
    }
    if ($("#toTask")) $("#toTask").onclick = () => { p.ex.extra = false; save(); advance(ctx); };
    $("#hint").onclick = () => { if (hinted) return; hinted = true; p.ex.points = Math.max(0, p.ex.points-5); p.ex.hints++; save(); renderMast(); $("#qFb").innerHTML = `<div class="notice warn"><b>Hint:</b> ${esc(q.h)}</div>`; $("#hint").disabled = true; };
    $("#check").onclick = () => {
      if (answered){ render_(); return; }
      let right;

        body.querySelectorAll(".opt").forEach(o => { const i=+o.dataset.i; if (i===q.a) o.classList.add("right"); else if (i===pick) o.classList.add("wrong"); }); }

      else { if (Object.keys(cls).length < q.items.length) return toast("Sort every item first."); right = q.items.every((it,i)=>cls[i]===it[1]);
        body.querySelectorAll(".seg").forEach(sg => { const ok = cls[sg.dataset.i] === q.items[sg.dataset.i][1]; sg.style.outline = `2px solid ${ok?"var(--ok)":"var(--bad)"}`; }); }
      answered = true; p.ex.attempts++;
      const qi = p.ex.queue.shift();
      if (right){ p.ex.correct++; p.ex.points += 10; speak(pickOne(P().right)); }
      else { p.ex.queue.push(qi); speak(pickOne(P().wrong)); }
      if (!p.ex.done && p.ex.correct >= NEED){ p.ex.done = true; logEvent(ctx.c, "Practice passed", `Correct: ${p.ex.correct}; Points: ${p.ex.points}; Attempts: ${p.ex.attempts}; Hints: ${p.ex.hints}`); setTimeout(()=>speak(P().unlocked), 1400); }
      save(); renderMast();
      const ans = q.type==="order" ? q.items.map((t,i)=>`${i+1}. ${esc(t)}`).join("<br>") : q.type==="classify" ? q.items.map(it=>`${esc(it[0])} → <b>${esc(q.cats[it[1]])}</b>`).join("<br>") : "";
      $("#qFb").innerHTML = `<div class="notice ${right?"ok":"bad"}"><b>${right?"Correct! +10":"Not this time."}</b> ${esc(q.w)}${!right&&ans?`<div style="margin-top:6px">${ans}</div>`:""}</div>`;
      $("#check").textContent = p.ex.done && !p.ex.extra ? "See result →" : "Next question →"; $("#hint").disabled = true;
    };
  };
  render_();
}

/* ---------- 6. MAIN TASK ---------- */
function tableRowsNeeded(rows, f){ if (f && f.need != null) return f.need; return Math.max(2, Math.ceil(rows * 2/3)); }
function rowDone(f, r){ return r && f.cols.every((_,k) => (f.rowLabels && k === 0) || String(r[k]||"").trim()); }
function fieldValid(f, val){
  if (f.t === "text") return words(val) >= f.min;
  if (f.t === "table"){ const rows = (val||[]).filter(r => rowDone(f, r)); return rows.length >= tableRowsNeeded(f.rows, f); }
  if (f.t === "sketch") return !!val;
  if (f.t === "choice") return !!val;
  if (f.t === "checklist") return (val||[]).length >= f.min;
}
function strandValid(ctx, i){ const fs = fieldsFor(ctx.c, ctx.gd)[i]; return fs.every(f => fieldValid(f, ctx.p.fields[f.id])) && !!ctx.p.bands[i]; }
function paneTask(pane, ctx){
  const { c, g, gd, cd, p, sc } = ctx, Y = yearKey(gd.myp), F = fieldsFor(c, gd), si = view.strand;
  pane.innerHTML = `<div class="stack">
    <div class="brief" data-read><b>${esc(sc.title)}</b> — ${esc(sc.client)}: ${esc(sc.problem)}. <span class="muted">${esc(sc.brief)}</span></div>
    <div class="strand-tabs" role="tablist">${ROMAN.map((r,i)=>`<button role="tab" data-i="${i}" class="${p.done[i]?"done":""}" aria-selected="${i===si}">Strand ${r}</button>`).join("")}</div>
    <div class="card stack" id="strandCard" data-read>
      <div class="strand-h"><span class="roman">${ROMAN[si]}</span><h3>${esc(cd.strands[Y][si])}</h3></div>

      ${c === "C" && si === 1 && gd.lab ? `<details open class="notranslate-none"><summary><b>Build Lab: software, milestones and skills</b></summary><div style="margin-top:10px">${labCard(gd, true)}</div></details>` : ""}
      <div class="stack" id="fields"></div>
      <div class="field"><span class="lbl">Rate yourself against the rubric for this strand</span>
        <div class="bands">${["1–2","3–4","5–6","7–8"].map(b=>`<button data-b="${b}" aria-pressed="${p.bands[si]===b}">${b}</button>`).join("")}</div></div>
      <div id="sMsg"></div>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" id="prevS" ${si===0?"disabled":""}>← Strand ${ROMAN[Math.max(0,si-1)]}</button>
        <button class="btn ok" id="doneS">${p.done[si]?"Update strand "+ROMAN[si]:"Mark strand "+ROMAN[si]+" complete"}</button>
      </div></div></div>`;
  pane.querySelectorAll(".strand-tabs button").forEach(b => b.onclick = () => { view.strand = +b.dataset.i; render(); });
  const box = $("#fields");
  F[si].forEach(f => box.appendChild(buildField(f, ctx)));
  pane.querySelectorAll(".bands button").forEach(b => b.onclick = () => { p.bands[si] = b.dataset.b; save(); pane.querySelectorAll(".bands button").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
  $("#prevS").onclick = () => { view.strand = si-1; render(); };
  $("#doneS").onclick = () => {
    const missing = F[si].filter(f => !fieldValid(f, p.fields[f.id])).map(f => fill(f.label, g, sc));
    if (!p.bands[si]) missing.push("Your self-rating for this strand");
    if (missing.length){ $("#sMsg").innerHTML = `<div class="notice bad"><b>Not finished yet.</b> Complete:<ul style="margin:6px 0 0;padding-left:18px">${missing.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`; speak(P().nearly); return; }
    const was = p.done[si]; p.done[si] = true; if (was && p.finished){ p.finished = false; p.edited = true; } save();
    if (!was) logEvent(c, `Strand ${ROMAN[si]} complete`, `Self-rating ${p.bands[si]}`);
    if (p.done.every(Boolean)){ speak(P().allDone); view.step = 6; render(); return; }
    speak(pickOne(P().right));
    const next = p.done.findIndex(d=>!d); view.strand = next; render(); window.scrollTo({top:0, behavior:"smooth"});

}
function buildField(f, ctx){
  const { p, g, sc } = ctx, el = document.createElement("div"); el.className = "field";
  const label = fill(f.label, g, sc);
  if (f.t === "text"){
    const v = p.fields[f.id] || "";
    el.innerHTML = `<label class="lbl" for="f_${f.id}">${esc(label)}</label><textarea id="f_${f.id}" class="notranslate" spellcheck="true">${esc(v)}</textarea><span class="counter" id="c_${f.id}"></span>`;
    const ta = el.querySelector("textarea"), cn = el.querySelector(".counter");
    const upd = () => { const w = words(ta.value); cn.textContent = `${w} / ${f.min} words minimum`; cn.classList.toggle("ok", w >= f.min); };
    ta.oninput = () => { p.fields[f.id] = ta.value; upd(); clearTimeout(ta._t); ta._t = setTimeout(save, 400); };
    upd();
  } else if (f.t === "table"){
    const v = p.fields[f.id] || Array.from({length:f.rows},()=>f.cols.map(()=>""));
    if (f.rowLabels) v.forEach((r,ri) => { r[0] = f.rowLabels[ri]; });
    p.fields[f.id] = v;
    el.innerHTML = `<span class="lbl">${esc(label)}</span><div class="scroll"><table class="tbl tin"><tr>${f.cols.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${v.map((r,ri)=>`<tr>${f.cols.map((_,ci)=> (f.rowLabels && ci===0) ? `<th scope="row" style="text-transform:none;letter-spacing:0;font-size:13px">${esc(f.rowLabels[ri])}</th>` : `<td class="notranslate"><input type="text" id="t_${f.id}_${ri}_${ci}" data-r="${ri}" data-c="${ci}" value="${esc(r[ci]||"")}" aria-label="${esc(f.cols[ci] || "")} ${esc(f.rowLabels ? f.rowLabels[ri] : "row " + (ri+1))}"></td>`).join("")}</tr>`).join("")}</table></div><span class="counter"></span>`;
    const cn = el.querySelector(".counter");
    const upd = () => { const done = v.filter(r => rowDone(f, r)).length, need = tableRowsNeeded(f.rows, f); cn.textContent = f.rowLabels ? `${done} of ${f.rows} rows complete` : `${done} of ${f.rows} rows complete (at least ${need} needed)`; cn.classList.toggle("ok", done >= need); };
    el.querySelectorAll("input").forEach(inp => inp.oninput = () => { v[+inp.dataset.r][+inp.dataset.c] = inp.value; upd(); clearTimeout(el._t); el._t = setTimeout(save, 400); });
    upd();
  } else if (f.t === "sketch"){
    el.appendChild(sketchBox(f, label, p));
  } else if (f.t === "choice"){
    el.innerHTML = `<label class="lbl" for="f_${f.id}">${esc(label)}</label><select id="f_${f.id}"><option value="">Choose…</option>${f.options.map(o=>`<option ${p.fields[f.id]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    el.querySelector("select").onchange = e => { p.fields[f.id] = e.target.value; save(); };
  } else if (f.t === "checklist"){
    const v = p.fields[f.id] = p.fields[f.id] || [];
    el.innerHTML = `<span class="lbl">${esc(label)}</span><div class="checks">${f.options.map((o,i)=>`<label class="chk"><input type="checkbox" id="k_${f.id}_${i}" ${v.includes(o)?"checked":""} data-o="${esc(o)}"> <span>${esc(o)}</span></label>`).join("")}</div><span class="counter"></span>`;
    const cn = el.querySelector(".counter"), upd = () => { cn.textContent = `${v.length} ticked (at least ${f.min} needed)`; cn.classList.toggle("ok", v.length >= f.min); };
    el.querySelectorAll("input").forEach(cb => cb.onchange = () => { const o = cb.dataset.o, k = v.indexOf(o); if (cb.checked && k < 0) v.push(o); if (!cb.checked && k >= 0) v.splice(k,1); upd(); save(); });

function sketchBox(f, label, p){
  const wrap = document.createElement("div"); wrap.className = "sk";

    wrap.innerHTML = `<span class="lbl" style="font-weight:bold">${esc(label)}</span>

      : `<div class="tools" role="toolbar" aria-label="Drawing tools">

        <div class="tools" data-labelbox hidden><input type="text" placeholder="Type a label, then tap the sketch to place it" style="flex:1;min-width:180px"></div>`}`;
    if (has){ wrap.querySelector('[data-a="redo"]').onclick = () => { p.fields[f.id] = null; save(); drawUI(); }; return; }
    const cv = wrap.querySelector("canvas"), cx = cv.getContext("2d");
    cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
    cx.strokeStyle = "#E4E8F0"; cx.lineWidth = 1; for (let x=0;x<cv.width;x+=40){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,cv.height); cx.stroke(); } for (let y=0;y<cv.height;y+=40){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(cv.width,y); cx.stroke(); }

      const [x,y] = pos(e);

      drawing = true; cv.setPointerCapture(e.pointerId); cx.beginPath(); cx.moveTo(x,y);
    };
    cv.onpointermove = e => { if (!drawing) return; const [x,y] = pos(e); cx.lineCap = "round"; cx.lineJoin = "round"; cx.strokeStyle = erase ? "#fff" : col; cx.lineWidth = erase ? 28 : w; cx.lineTo(x,y); cx.stroke(); dirty = true; };
    cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
    wrap.querySelectorAll(".sw").forEach(b => b.onclick = () => { col = b.dataset.col; erase = false; wrap.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
    const act = a => ({ thin:()=>{w=4;erase=false}, thick:()=>{w=10;erase=false}, erase:()=>{erase=true}, clear:()=>{ drawUI(); }, text:()=>{ textMode = true; const lb = wrap.querySelector("[data-labelbox]"); lb.hidden = false; lb.querySelector("input").focus(); },
      save:()=>{ if (!dirty) return toast("Draw your idea first, or upload a photo."); p.fields[f.id] = shrink(cv); save(); speak(P().sketch); drawUI(); } })[a]?.();
    wrap.querySelectorAll("[data-a]").forEach(b => b.onclick = () => act(b.dataset.a));
    wrap.querySelector('input[type=file]').onchange = ev => {
      const file = ev.target.files[0]; if (!file) return;
      const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const c2 = document.createElement("canvas"); const sc = Math.min(1, 1100/Math.max(im.width, im.height)); c2.width = im.width*sc; c2.height = im.height*sc; const x2 = c2.getContext("2d"); x2.fillStyle="#fff"; x2.fillRect(0,0,c2.width,c2.height); x2.drawImage(im,0,0,c2.width,c2.height); p.fields[f.id] = c2.toDataURL("image/jpeg", .72); save(); drawUI(); }; im.src = rd.result; }; rd.readAsDataURL(file);
    };
  };
  drawUI(); return wrap;
}
function shrink(cv){ const c2 = document.createElement("canvas"); c2.width = 900; c2.height = 675; c2.getContext("2d").drawImage(cv,0,0,900,675); return c2.toDataURL("image/jpeg", .72); }

function buildPDF(ctx){
  const { c, g, gd, cd, p, sc } = ctx, u = user(), Y = yearKey(gd.myp), F = fieldsFor(c, gd);
  if (!window.jspdf) throw new Error("PDF tool not loaded — check the internet connection");
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit:"mm", format:"a4" });
  const W = 210, M = 16, NAVY = [27,45,78], RED = [220,43,62];
  let y = 0;
  const bar = () => { doc.setFillColor(...NAVY); doc.rect(0,0,W,22,"F"); doc.setFillColor(...RED); doc.rect(0,22,W,1.6,"F");
    doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(`SISD Design Studio · MYP ${gd.subject||"Design"} Year ${gd.myp}`, M, 10);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.text(`Criterion ${c}: ${cd.name}  ·  ${u.name}  ·  ${gLabel(g)}  ·  ${u.teacher}`, M, 16.5); doc.setTextColor(20); };
  const header = () => { bar(); y = 32; };
  const need = h => { if (y + h > 282){ doc.addPage(); header(); } };
  const clean = t => String(t||"").replace(/[–—]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,"...").replace(/·/g,"-").replace(/[^\x00-\xFF]/g,"");
  const para = (t, size=10.5, style="normal", color=[22,34,58]) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color);
    doc.splitTextToSize(clean(t), W-2*M).forEach(line => { need(5.4); doc.text(line, M, y); y += size*0.47; }); y += 1.5; };
  header();
  para(gd.unit, 16, "bold"); para(`${gd.choose ? (g==="6"?"Building":"Cause") : "Design challenge"}: ${sc.title} — ${sc.client}: ${sc.problem}.`, 10.5); para(sc.brief, 10, "italic", [91,103,130]);
  para(`Email: ${session.email}   ·   Date: ${new Date().toLocaleDateString("en-GB")}   ·   Practice: ${p.ex.correct} correct, ${p.ex.points} points`, 9, "normal", [91,103,130]);
  y += 2;
  F.forEach((fs,i) => {
    need(20); doc.setFillColor(233,237,245); doc.rect(M, y-5, W-2*M, 10.5, "F"); doc.setTextColor(...RED); doc.setFont("helvetica","bold"); doc.setFontSize(11.5);
    doc.text(`Strand ${ROMAN[i]}`, M+2, y+1.5); doc.setTextColor(...NAVY); doc.setFontSize(9.5);
    doc.text(`Self-rating: ${p.bands[i]||"-"}`, W-M-2, y+1.5, { align:"right" }); y += 10;
    para(cd.strands[Y][i], 9.5, "italic", [91,103,130]);
    fs.forEach(f => {
      const v = p.fields[f.id];
      if (f.t === "sketch" && v){ const pr = doc.getImageProperties(v); need(Math.min(120, (W-2*M) * pr.height / pr.width) + 12); }
      else if (f.t === "table") need(24); else need(12);
      para(fill(f.label, g, sc), 10, "bold", NAVY);
      if (f.t === "text" || f.t === "choice") para(v || "(not answered)", 10.5);
      else if (f.t === "checklist") para((v||[]).map(x => "[x] " + x).join("\n") || "(none ticked)", 10);
      else if (f.t === "table"){
        const body = (v||[]).filter(r=>r.slice(f.rowLabels?1:0).some(x=>String(x).trim()));
        doc.autoTable({ startY: y, head:[f.cols.map(clean)], body: body.length?body.map(r=>r.map(clean)):[f.cols.map(()=>"")], margin:{left:M,right:M, top:30}, styles:{ fontSize:9, cellPadding:2, lineColor:[216,222,234], lineWidth:.2 }, headStyles:{ fillColor:NAVY, textColor:255 }, theme:"grid", didDrawPage: bar });
        y = doc.lastAutoTable.finalY + 5;
      } else if (f.t === "sketch"){
        if (v){ const props = doc.getImageProperties(v); const w = W-2*M, h = Math.min(120, w * props.height / props.width), ww = h * props.width / props.height; need(h+4); doc.addImage(v, "JPEG", M, y, ww, h); y += h + 5; }
        else para("(no sketch)", 10, "italic");
      }
    });
    y += 3;
  });
  need(70); para("Assessment rubric", 12, "bold", NAVY);
  doc.autoTable({ startY:y, head:[["Band","Descriptor"]], body: COURSE.rubrics[c][Y].map(r=>[clean(r[0]), clean(stripTags(r[1]))]), margin:{left:M,right:M,top:30}, styles:{fontSize:8.5,cellPadding:2}, headStyles:{fillColor:NAVY}, columnStyles:{0:{cellWidth:16}}, theme:"grid", didDrawPage: bar });
  y = doc.lastAutoTable.finalY + 8;
  need(26); para("Teacher mark: ______ / 8        Comment:", 10.5, "bold"); doc.setDrawColor(200); for (let k=0;k<3;k++){ need(8); doc.line(M, y+2, W-M, y+2); y += 8; }
  const n = doc.getNumberOfPages(); for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(`Page ${i} of ${n}`, W-M, 292, { align:"right" }); doc.text("Swiss International Scientific School Dubai", M, 292); }
  const nm = u.name.replace(/[^a-z0-9]+/gi,"_");
  return saveFile(`${gLabel(g).replace(/\s+/g,"")}_Criterion${c}_${nm}.pdf`, doc.output("blob"), () => doc.save(`${gLabel(g).replace(/\s+/g,"")}_Criterion${c}_${nm}.pdf`));
}
async function saveFile(name, blob, fallback){

  fallback();
}
